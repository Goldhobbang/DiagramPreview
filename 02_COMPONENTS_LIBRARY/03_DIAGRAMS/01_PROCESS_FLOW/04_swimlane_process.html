<!-- @card 스윔레인 프로세스 | 부서별 R&R 프로세스. 3~4 레인 × 단계 그리드 | 1600x700 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스윔레인 프로세스</title>
    <!-- 자기완결형: CSS 전체를 아래에 인라인했다. 외부 링크 없음.
       공통 토큰을 고치려면 03_ASSETS/css/를 고친 뒤 이 블록도 함께 갱신한다. -->
  <style>
/* ===== 03_ASSETS/css/00_reset.css ===== */
/* ==========================================================================
   00_reset.css — 슬라이드 전용 최소 리셋
   normalize.css를 쓰지 않는 이유: 범용 규칙이 Figma 레이어에 노이즈를 더한다.
   로드 순서: 00_reset → 01_variables → 02_slide_base → 03_components → 테마 토큰
   ========================================================================== */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* rem을 쓰지 않지만, 브라우저 기본 확대 설정의 영향을 없애기 위해 고정 */
  font-size: 16px;
}

body {
  background: #52525b;              /* 캔버스 밖 회색 — 슬라이드 경계를 눈으로 구분 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

th {
  text-align: left;
  font-weight: inherit;
}

/* 슬라이드는 정적 캡처 대상 — 애니메이션은 최종 상태로 고정한다 */
*,
*::before,
*::after {
  animation: none !important;
  transition: none !important;
}

/* ===== 03_ASSETS/css/01_variables.css ===== */
/* ==========================================================================
   01_variables.css — 디자인 토큰 단일 소스
   규칙: 의미 기반 이름만 쓴다 (--blue-500 X / --color-accent O)
   테마 교체는 같은 변수명을 덮어쓰는 방식. 슬라이드는 .v1/.v2/.v3 클래스에 건다.
   상세: 00_GUIDES/02_DESIGN_SYSTEM.md
   ========================================================================== */

:root {
  /* --- 캔버스 --------------------------------------------------------- */
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-pad: 96px;               /* 세이프 영역 */
  --content-w: 1728px;             /* 1920 - 96*2 */
  --content-h: 888px;              /* 1080 - 96*2 */
  --grid-cols: 12;
  --grid-gutter: 32px;

  /* --- 폰트 ----------------------------------------------------------- */
  --font-sans: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  --font-serif: "Noto Serif KR", Georgia, serif;
  --font-kicker: var(--font-sans);  /* 라벨/킥커 전용 훅 — 대부분 본문과 동일, 럭셔리 계열만 세리프로 교체 */

  /* --- 타입 스케일 (1080p 프로젝터 기준 / 최소 18px) ------------------- */
  --fs-display: 96px;
  --fs-h1: 64px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-body-l: 28px;
  --fs-body-m: 24px;
  --fs-caption: 18px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* line-height만 배수 사용 — 폰트 교체에 강하다 */
  --lh-tight: 1.2;
  --lh-heading: 1.3;
  --lh-body: 1.6;

  --ls-tight: -0.02em;             /* 48px 이상 대제목 */
  --ls-normal: 0;
  --ls-wide: 0.05em;               /* 대문자 라벨 */

  /* --- 간격 (8px 배수) ------------------------------------------------ */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 48px;
  --sp-7: 64px;
  --sp-8: 96px;
  --sp-9: 128px;

  /* --- 색: 시맨틱 (테마마다 값이 바뀜) -------------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-surface-alt: #e4e4e7;
  --color-text: #18181b;
  --color-text-muted: #71717a;
  --color-text-invert: #ffffff;
  --color-accent: #2563eb;
  --color-accent-sub: #60a5fa;
  --color-border: #d4d4d8;

  /* --- 색: 데이터 시각화 팔레트 (반드시 1→6 순서대로 사용) ------------ */
  --color-data-1: #2563eb;
  --color-data-2: #0ea5e9;
  --color-data-3: #14b8a6;
  --color-data-4: #f59e0b;
  --color-data-5: #ef4444;
  --color-data-6: #8b5cf6;

  /* --- 색: 상태 (테마 무관 고정) -------------------------------------- */
  --color-positive: #16a34a;
  --color-negative: #dc2626;
  --color-neutral: #71717a;

  /* --- 색: 반전 슬라이드 (전면 이미지 등 어두운 배경 1장용) ------------ */
  --color-bg-inverse: #0f172a;
  --color-text-on-inverse: #ffffff;
  --color-text-on-inverse-muted: #cbd5e1;

  /* --- 카드 보더 (Minimal Mono처럼 선으로 구분하는 테마만 1px로 올림) -- */
  --card-border-w: 0px;

  /* --- 라운드 --------------------------------------------------------- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* --- 그림자 (Figma 유실 방지: 다중 그림자 금지, 1개만) -------------- */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);

  /* --- 선 ------------------------------------------------------------- */
  --border-w: 1px;
  --border-w-thick: 3px;
}

/* ===== 03_ASSETS/css/02_slide_base.css — .component 캔버스만 ===== */
.component {
  width: 1400px;
  height: 700px;
  overflow: hidden;
  position: relative;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-m);
  line-height: var(--lh-body);
  margin: 0 auto;
  padding: var(--sp-6);
}

/* ===== 03_ASSETS/css/03_components.css ===== */
/* ==========================================================================
   03_components.css — 여러 다이어그램/슬라이드가 공유하는 최소 컴포넌트
   여기 있는 것만으로 다이어그램이 완성되지는 않는다. 반복되는 것만 올린다.
   ========================================================================== */

/* --- 카드 ------------------------------------------------------------ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-outlined {
  background: var(--color-bg);
  border: var(--border-w) solid var(--color-border);
}

.card-elevated {
  background: var(--color-bg);
  box-shadow: var(--shadow-sm);
}

/* --- 번호 배지 (프로세스 단계용) ------------------------------------- */
.step-num {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  color: var(--color-text-invert);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* --- 태그 / 배지 ----------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--color-surface-alt);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
}

.badge-accent {
  background: var(--color-accent);
  color: var(--color-text-invert);
}

/* --- 구분선 ---------------------------------------------------------- */
.divider {
  height: var(--border-w);
  background: var(--color-border);
  border: none;
}

.divider-accent {
  height: var(--border-w-thick);
  width: 96px;
  background: var(--color-accent);
}

/* --- 라벨 붙은 값 (KPI) ---------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.stat-value {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  color: var(--color-accent);
}

.stat-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  letter-spacing: var(--ls-wide);
}

/* --- 데이터 계열 색 (1~6 순서대로 사용) ------------------------------ */
.d1 { --c: var(--color-data-1); }
.d2 { --c: var(--color-data-2); }
.d3 { --c: var(--color-data-3); }
.d4 { --c: var(--color-data-4); }
.d5 { --c: var(--color-data-5); }
.d6 { --c: var(--color-data-6); }

.fill-data   { background: var(--c, var(--color-data-1)); }
.text-data   { color: var(--c, var(--color-data-1)); }
.border-data { border-color: var(--c, var(--color-data-1)); }

/* --- 정렬 유틸 ------------------------------------------------------- */
.items-center   { align-items: center; }
.items-start    { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grow           { flex: 1; }

/* ===== 이 다이어그램 전용 ===== */
    .component { width: 1600px; height: 700px; }

    .lane-head {
      display: flex;
      align-items: baseline;
      gap: var(--sp-4);
      margin-bottom: var(--sp-4);
    }
    .lane-heading {
      font-size: var(--fs-h3);
      font-weight: var(--fw-semibold);
    }
    .lane-note {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
    }

    /* 레인 간 커넥터를 SVG 좌표로 그리므로 노드도 absolute로 맞춘다 */
    .lanes { position: relative; width: 1504px; height: 520px; }
    .lanes-svg { position: absolute; left: 0; top: 0; }

    .lane-label {
      position: absolute;
      left: 0;
      width: 200px;
      height: 152px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--sp-1);
      padding-left: var(--sp-4);
      border-left: var(--border-w-thick) solid var(--c, var(--color-data-1));
    }
    .lane-name {
      font-size: var(--fs-body-l);
      font-weight: var(--fw-semibold);
    }
    .lane-owner {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
    }

    .lane-card {
      position: absolute;
      width: 220px;
      height: 112px;
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      border-top: var(--border-w-thick) solid var(--c, var(--color-data-1));
      padding: var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
    }
    .lane-step {
      font-size: var(--fs-caption);
      font-weight: var(--fw-bold);
      letter-spacing: var(--ls-wide);
      color: var(--c, var(--color-data-1));
    }
    .lane-task {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      line-height: 1.4;
    }
    .lane-sla {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="component">
    <div class="lane-head">
      <p class="lane-heading">법인 신규 계약 처리 프로세스</p>
      <p class="lane-note">접수부터 계약 체결까지 평균 5영업일</p>
    </div>

    <div class="lanes">
      <svg class="lanes-svg" width="1504" height="520" viewBox="0 0 1504 520" fill="none">
        <!-- 레인 배경 -->
        <rect x="216" y="0"   width="1288" height="152" fill="var(--color-surface)" opacity="0.4"/>
        <rect x="216" y="184" width="1288" height="152" fill="var(--color-surface)" opacity="0.4"/>
        <rect x="216" y="368" width="1288" height="152" fill="var(--color-surface)" opacity="0.4"/>

        <!-- ① 영업 → ② 심사 -->
        <polyline points="456,76 476,76 476,260 482,260" stroke="var(--color-border)" stroke-width="3" fill="none"/>
        <polygon points="482,252 482,268 496,260" fill="var(--color-border)"/>
        <!-- ② → ③ 같은 레인 -->
        <polyline points="716,260 742,260" stroke="var(--color-border)" stroke-width="3" fill="none"/>
        <polygon points="742,252 742,268 756,260" fill="var(--color-border)"/>
        <!-- ③ 심사 → ④ 운영 -->
        <polyline points="976,260 996,260 996,444 1002,444" stroke="var(--color-border)" stroke-width="3" fill="none"/>
        <polygon points="1002,436 1002,452 1016,444" fill="var(--color-border)"/>
        <!-- ④ 운영 → ⑤ 영업 -->
        <polyline points="1236,444 1256,444 1256,76 1262,76" stroke="var(--color-border)" stroke-width="3" fill="none"/>
        <polygon points="1262,68 1262,84 1276,76" fill="var(--color-border)"/>
      </svg>

      <div class="lane-label d1" style="top: 0;">
        <p class="lane-name">영업팀</p>
        <p class="lane-owner">고객 접점 · 계약</p>
      </div>
      <div class="lane-label d2" style="top: 184px;">
        <p class="lane-name">심사팀</p>
        <p class="lane-owner">신용 · 리스크</p>
      </div>
      <div class="lane-label d3" style="top: 368px;">
        <p class="lane-name">운영팀</p>
        <p class="lane-owner">계정 · 정산</p>
      </div>

      <div class="lane-card d1" style="left: 236px; top: 20px;">
        <p class="lane-step">STEP 1</p>
        <p class="lane-task">리드 접수 · 자격 확인</p>
        <p class="lane-sla">0.5일</p>
      </div>
      <div class="lane-card d2" style="left: 496px; top: 204px;">
        <p class="lane-step">STEP 2</p>
        <p class="lane-task">재무제표 기반 신용 평가</p>
        <p class="lane-sla">2일</p>
      </div>
      <div class="lane-card d2" style="left: 756px; top: 204px;">
        <p class="lane-step">STEP 3</p>
        <p class="lane-task">한도 산정 · 리스크 검토</p>
        <p class="lane-sla">1일</p>
      </div>
      <div class="lane-card d3" style="left: 1016px; top: 388px;">
        <p class="lane-step">STEP 4</p>
        <p class="lane-task">계정 개설 · 정산 조건 등록</p>
        <p class="lane-sla">1일</p>
      </div>
      <div class="lane-card d1" style="left: 1276px; top: 20px;">
        <p class="lane-step">STEP 5</p>
        <p class="lane-task">계약서 발송 · 체결</p>
        <p class="lane-sla">0.5일</p>
      </div>
    </div>
  </div>
  <!-- self-fit: 창이든 iframe이든 컨테이너에 맞춰 스스로 축소한다.
       갤러리 썸네일은 iframe 폭을 캔버스 폭과 같게 주므로 zoom=1 — 이중 축소가 없다. -->
  <script>
    (function () {
      var el = document.querySelector('.component');
      if (!el) return;
      var w = el.offsetWidth, h = el.offsetHeight;   // zoom 걸기 전에 1회만 측정
      function fit() {
        document.body.style.zoom = Math.min(1, innerWidth / w, innerHeight / h);
      }
      addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
