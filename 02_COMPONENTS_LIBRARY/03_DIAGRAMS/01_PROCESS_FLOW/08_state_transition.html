<!-- @card 상태 전이도 | 상태 노드 + 전이 조건 화살표 | 1400x700 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상태 전이도</title>
  <!-- 자기완결형: CSS 전체를 아래에 인라인했다. 외부 링크 없음.
       공통 토큰을 고치려면 03_ASSETS/css/를 고친 뒤 이 블록도 함께 갱신한다. -->
  <style>
/* ===== 03_ASSETS/css/00_reset.css ===== */
/* ==========================================================================
   00_reset.css — 슬라이드 전용 최소 리셋
   normalize.css를 쓰지 않는 이유: 범용 규칙이 Figma 레이어에 노이즈를 더한다.
   로드 순서: 00_reset → 01_variables → 02_slide_base → 03_components → 테마 토큰
   ========================================================================== */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* rem을 쓰지 않지만, 브라우저 기본 확대 설정의 영향을 없애기 위해 고정 */
  font-size: 16px;
}

body {
  background: #52525b;              /* 캔버스 밖 회색 — 슬라이드 경계를 눈으로 구분 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

th {
  text-align: left;
  font-weight: inherit;
}

/* 슬라이드는 정적 캡처 대상 — 애니메이션은 최종 상태로 고정한다 */
*,
*::before,
*::after {
  animation: none !important;
  transition: none !important;
}

/* ===== 03_ASSETS/css/01_variables.css ===== */
/* ==========================================================================
   01_variables.css — 디자인 토큰 단일 소스
   규칙: 의미 기반 이름만 쓴다 (--blue-500 X / --color-accent O)
   테마 교체는 같은 변수명을 덮어쓰는 방식. 슬라이드는 .v1/.v2/.v3 클래스에 건다.
   상세: 00_GUIDES/02_DESIGN_SYSTEM.md
   ========================================================================== */

:root {
  /* --- 캔버스 --------------------------------------------------------- */
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-pad: 96px;               /* 세이프 영역 */
  --content-w: 1728px;             /* 1920 - 96*2 */
  --content-h: 888px;              /* 1080 - 96*2 */
  --grid-cols: 12;
  --grid-gutter: 32px;

  /* --- 폰트 ----------------------------------------------------------- */
  --font-sans: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  --font-serif: "Noto Serif KR", Georgia, serif;
  --font-kicker: var(--font-sans);  /* 라벨/킥커 전용 훅 — 대부분 본문과 동일, 럭셔리 계열만 세리프로 교체 */

  /* --- 타입 스케일 (1080p 프로젝터 기준 / 최소 18px) ------------------- */
  --fs-display: 96px;
  --fs-h1: 64px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-body-l: 28px;
  --fs-body-m: 24px;
  --fs-caption: 18px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* line-height만 배수 사용 — 폰트 교체에 강하다 */
  --lh-tight: 1.2;
  --lh-heading: 1.3;
  --lh-body: 1.6;

  --ls-tight: -0.02em;             /* 48px 이상 대제목 */
  --ls-normal: 0;
  --ls-wide: 0.05em;               /* 대문자 라벨 */

  /* --- 간격 (8px 배수) ------------------------------------------------ */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 48px;
  --sp-7: 64px;
  --sp-8: 96px;
  --sp-9: 128px;

  /* --- 색: 시맨틱 (테마마다 값이 바뀜) -------------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-surface-alt: #e4e4e7;
  --color-text: #18181b;
  --color-text-muted: #71717a;
  --color-text-invert: #ffffff;
  --color-accent: #2563eb;
  --color-accent-sub: #60a5fa;
  --color-border: #d4d4d8;

  /* --- 색: 데이터 시각화 팔레트 (반드시 1→6 순서대로 사용) ------------ */
  --color-data-1: #2563eb;
  --color-data-2: #0ea5e9;
  --color-data-3: #14b8a6;
  --color-data-4: #f59e0b;
  --color-data-5: #ef4444;
  --color-data-6: #8b5cf6;

  /* --- 색: 상태 (테마 무관 고정) -------------------------------------- */
  --color-positive: #16a34a;
  --color-negative: #dc2626;
  --color-neutral: #71717a;

  /* --- 색: 반전 슬라이드 (전면 이미지 등 어두운 배경 1장용) ------------ */
  --color-bg-inverse: #0f172a;
  --color-text-on-inverse: #ffffff;
  --color-text-on-inverse-muted: #cbd5e1;

  /* --- 카드 보더 (Minimal Mono처럼 선으로 구분하는 테마만 1px로 올림) -- */
  --card-border-w: 0px;

  /* --- 라운드 --------------------------------------------------------- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* --- 그림자 (Figma 유실 방지: 다중 그림자 금지, 1개만) -------------- */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);

  /* --- 선 ------------------------------------------------------------- */
  --border-w: 1px;
  --border-w-thick: 3px;
}

/* ===== 03_ASSETS/css/02_slide_base.css — .component 캔버스만 ===== */
.component {
  width: 1400px;
  height: 700px;
  overflow: hidden;
  position: relative;
  /* 배경을 깔지 않는다 — 조합 빌더에서 여러 개를 겹쳐야 한다.
     흰색은 보여주는 쪽이 깐다: 아래 body · 갤러리 .thumb · 빌더 모눈지 */
  background: transparent;
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-m);
  line-height: var(--lh-body);
  margin: 0 auto;
  padding: var(--sp-6);
}

/* 파일을 단독으로 열었을 때만 흰 종이를 깐다 (00_reset.css의 회색을 덮는다).
   조합 빌더는 iframe 안에서 이 규칙을 끄고 노드를 투명하게 쓴다. */
body {
  background: var(--color-bg);
}

/* ===== 03_ASSETS/css/03_components.css ===== */
/* ==========================================================================
   03_components.css — 여러 다이어그램/슬라이드가 공유하는 최소 컴포넌트
   여기 있는 것만으로 다이어그램이 완성되지는 않는다. 반복되는 것만 올린다.
   ========================================================================== */

/* --- 카드 ------------------------------------------------------------ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-outlined {
  background: var(--color-bg);
  border: var(--border-w) solid var(--color-border);
}

.card-elevated {
  background: var(--color-bg);
  box-shadow: var(--shadow-sm);
}

/* --- 번호 배지 (프로세스 단계용) ------------------------------------- */
.step-num {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  color: var(--color-text-invert);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* --- 태그 / 배지 ----------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--color-surface-alt);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
}

.badge-accent {
  background: var(--color-accent);
  color: var(--color-text-invert);
}

/* --- 구분선 ---------------------------------------------------------- */
.divider {
  height: var(--border-w);
  background: var(--color-border);
  border: none;
}

.divider-accent {
  height: var(--border-w-thick);
  width: 96px;
  background: var(--color-accent);
}

/* --- 라벨 붙은 값 (KPI) ---------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.stat-value {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  color: var(--color-accent);
}

.stat-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  letter-spacing: var(--ls-wide);
}

/* --- 데이터 계열 색 (1~6 순서대로 사용) ------------------------------ */
.d1 { --c: var(--color-data-1); }
.d2 { --c: var(--color-data-2); }
.d3 { --c: var(--color-data-3); }
.d4 { --c: var(--color-data-4); }
.d5 { --c: var(--color-data-5); }
.d6 { --c: var(--color-data-6); }

.fill-data   { background: var(--c, var(--color-data-1)); }
.text-data   { color: var(--c, var(--color-data-1)); }
.border-data { border-color: var(--c, var(--color-data-1)); }

/* --- 정렬 유틸 ------------------------------------------------------- */
.items-center   { align-items: center; }
.items-start    { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grow           { flex: 1; }
/* ===== 이 다이어그램 전용 ===== */
    .component { width: 1400px; height: 700px; }

    .st-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); }
    .st-sub {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      margin: var(--sp-1) 0 var(--sp-4);
    }

    /* 전이 화살표는 SVG, 상태 박스·조건 라벨은 HTML — 좌표를 맞추기 위해 absolute */
    .st { position: relative; width: 1304px; height: 470px; }
    .st-svg { position: absolute; left: 0; top: 0; }

    .st-node {
      position: absolute;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      padding: var(--sp-3);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      border: 2px solid var(--c, var(--color-border));
      text-align: center;
    }
    .st-name {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
    }
    .st-who {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
    }
    /* 시작·종료 상태는 면을 채워 구분한다 */
    .st-node.terminal {
      background: var(--c);
      border-color: var(--c);
      color: var(--color-text-invert);
    }
    .st-node.terminal .st-who { color: var(--color-text-invert); opacity: .85; }

    .st-cond {
      position: absolute;
      font-size: var(--fs-caption);
      color: var(--color-text);
      background: var(--color-bg);
      padding: 0 var(--sp-2);
      white-space: nowrap;
    }
    .st-cond.warn { color: var(--color-negative); }

    .st-note {
      margin-top: var(--sp-3);
      padding-top: var(--sp-3);
      border-top: var(--border-w) solid var(--color-border);
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
    }
    .st-note b { color: var(--color-text); font-weight: var(--fw-semibold); }
  </style>
</head>
<body>
  <div class="component">
    <p class="st-title">결재 문서 상태 전이</p>
    <p class="st-sub">상태 6개 · 전이 8개 — 삭제는 없다. 감사 요건상 상태만 바뀐다</p>

    <div class="st">
      <svg class="st-svg" width="1304" height="470" viewBox="0 0 1304 470" fill="none">
        <!-- 작성중 → 상신 -->
        <path d="M220 60 H340" stroke="var(--color-border)" stroke-width="3"/>
        <path d="M328 54 L340 60 L328 66 Z" fill="var(--color-border)"/>
        <!-- 상신 → 검토중 -->
        <path d="M560 60 H680" stroke="var(--color-border)" stroke-width="3"/>
        <path d="M668 54 L680 60 L668 66 Z" fill="var(--color-border)"/>
        <!-- 검토중 → 승인완료 -->
        <path d="M900 60 H1020" stroke="var(--color-positive)" stroke-width="3"/>
        <path d="M1008 54 L1020 60 L1008 66 Z" fill="var(--color-positive)"/>
        <!-- 검토중 → 보류 (아래로) -->
        <path d="M790 118 V222" stroke="var(--color-data-4)" stroke-width="3"/>
        <path d="M784 210 L790 222 L796 210 Z" fill="var(--color-data-4)"/>
        <!-- 보류 → 검토중 (되돌림, 우측 우회) -->
        <path d="M900 250 H960 V60" stroke="var(--color-data-4)" stroke-width="3" stroke-dasharray="8 6"/>
        <path d="M954 72 L960 60 L966 72 Z" fill="var(--color-data-4)"/>
        <!-- 검토중 → 반려 (아래 왼쪽) -->
        <path d="M680 90 H560 V330" stroke="var(--color-negative)" stroke-width="3"/>
        <path d="M554 318 L560 330 L566 318 Z" fill="var(--color-negative)"/>
        <!-- 반려 → 작성중 (재작성) -->
        <path d="M340 358 H110 V118" stroke="var(--color-border)" stroke-width="3" stroke-dasharray="8 6"/>
        <path d="M104 130 L110 118 L116 130 Z" fill="var(--color-border)"/>
        <!-- 승인완료 → 회수 (하단 종료) -->
        <path d="M1130 118 V386" stroke="var(--color-border)" stroke-width="3"/>
        <path d="M1124 374 L1130 386 L1136 374 Z" fill="var(--color-border)"/>
      </svg>

      <div class="st-node" data-anchor="state-draft" style="left: 0; top: 8px; --c: var(--color-data-1)">
        <p class="st-name">작성중</p>
        <p class="st-who">기안자</p>
      </div>
      <div class="st-node" data-anchor="state-submitted" style="left: 340px; top: 8px; --c: var(--color-data-2)">
        <p class="st-name">상신</p>
        <p class="st-who">문서번호 발급</p>
      </div>
      <div class="st-node" data-anchor="state-review" style="left: 680px; top: 8px; --c: var(--color-accent)">
        <p class="st-name">검토중</p>
        <p class="st-who">승인자 1~3단계</p>
      </div>
      <div class="st-node terminal" data-anchor="state-approved" style="left: 1020px; top: 8px; --c: var(--color-positive)">
        <p class="st-name">승인 완료</p>
        <p class="st-who">ERP 전표 생성</p>
      </div>
      <div class="st-node" data-anchor="state-hold" style="left: 680px; top: 222px; --c: var(--color-data-4)">
        <p class="st-name">보류</p>
        <p class="st-who">자료 보완 요청</p>
      </div>
      <div class="st-node terminal" data-anchor="state-rejected" style="left: 450px; top: 330px; --c: var(--color-negative)">
        <p class="st-name">반려</p>
        <p class="st-who">사유 필수 입력</p>
      </div>
      <div class="st-node" data-anchor="state-withdrawn" style="left: 1020px; top: 386px; --c: var(--color-neutral)">
        <p class="st-name">회수</p>
        <p class="st-who">기안자 요청 · 3일 이내</p>
      </div>

      <span class="st-cond" style="left: 232px; top: 34px;">상신 버튼</span>
      <span class="st-cond" style="left: 572px; top: 34px;">첨부 검사 통과</span>
      <span class="st-cond" style="left: 924px; top: 34px;">최종 승인</span>
      <span class="st-cond" style="left: 800px; top: 160px;">자료 부족</span>
      <span class="st-cond" style="left: 968px; top: 160px;">보완 제출</span>
      <span class="st-cond warn" style="left: 470px; top: 200px;">반려</span>
      <span class="st-cond" style="left: 120px; top: 240px;">재작성</span>
      <span class="st-cond" style="left: 1140px; top: 250px;">기안자 회수</span>
    </div>

    <p class="st-note">
      <b>보류 → 검토중</b>은 되돌림 전이(점선)로, 승인 단계는 초기화되지 않는다.
      반려 후 재작성은 새 문서번호를 받는다 — 이전 이력은 그대로 보관된다.
    </p>
  </div>
</body>
</html>
