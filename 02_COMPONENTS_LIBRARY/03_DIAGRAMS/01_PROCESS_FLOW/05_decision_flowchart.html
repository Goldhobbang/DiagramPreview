<!-- @card 의사결정 플로우차트 | 조건 분기 로직. 마름모 판단 노드 + Yes/No | 1200x800 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>의사결정 플로우차트</title>
    <!-- 자기완결형: CSS 전체를 아래에 인라인했다. 외부 링크 없음.
       공통 토큰을 고치려면 03_ASSETS/css/를 고친 뒤 이 블록도 함께 갱신한다. -->
  <style>
/* ===== 03_ASSETS/css/00_reset.css ===== */
/* ==========================================================================
   00_reset.css — 슬라이드 전용 최소 리셋
   normalize.css를 쓰지 않는 이유: 범용 규칙이 Figma 레이어에 노이즈를 더한다.
   로드 순서: 00_reset → 01_variables → 02_slide_base → 03_components → 테마 토큰
   ========================================================================== */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* rem을 쓰지 않지만, 브라우저 기본 확대 설정의 영향을 없애기 위해 고정 */
  font-size: 16px;
}

body {
  background: #52525b;              /* 캔버스 밖 회색 — 슬라이드 경계를 눈으로 구분 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

th {
  text-align: left;
  font-weight: inherit;
}

/* 슬라이드는 정적 캡처 대상 — 애니메이션은 최종 상태로 고정한다 */
*,
*::before,
*::after {
  animation: none !important;
  transition: none !important;
}

/* ===== 03_ASSETS/css/01_variables.css ===== */
/* ==========================================================================
   01_variables.css — 디자인 토큰 단일 소스
   규칙: 의미 기반 이름만 쓴다 (--blue-500 X / --color-accent O)
   테마 교체는 같은 변수명을 덮어쓰는 방식. 슬라이드는 .v1/.v2/.v3 클래스에 건다.
   상세: 00_GUIDES/02_DESIGN_SYSTEM.md
   ========================================================================== */

:root {
  /* --- 캔버스 --------------------------------------------------------- */
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-pad: 96px;               /* 세이프 영역 */
  --content-w: 1728px;             /* 1920 - 96*2 */
  --content-h: 888px;              /* 1080 - 96*2 */
  --grid-cols: 12;
  --grid-gutter: 32px;

  /* --- 폰트 ----------------------------------------------------------- */
  --font-sans: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  --font-serif: "Noto Serif KR", Georgia, serif;
  --font-kicker: var(--font-sans);  /* 라벨/킥커 전용 훅 — 대부분 본문과 동일, 럭셔리 계열만 세리프로 교체 */

  /* --- 타입 스케일 (1080p 프로젝터 기준 / 최소 18px) ------------------- */
  --fs-display: 96px;
  --fs-h1: 64px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-body-l: 28px;
  --fs-body-m: 24px;
  --fs-caption: 18px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* line-height만 배수 사용 — 폰트 교체에 강하다 */
  --lh-tight: 1.2;
  --lh-heading: 1.3;
  --lh-body: 1.6;

  --ls-tight: -0.02em;             /* 48px 이상 대제목 */
  --ls-normal: 0;
  --ls-wide: 0.05em;               /* 대문자 라벨 */

  /* --- 간격 (8px 배수) ------------------------------------------------ */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 48px;
  --sp-7: 64px;
  --sp-8: 96px;
  --sp-9: 128px;

  /* --- 색: 시맨틱 (테마마다 값이 바뀜) -------------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-surface-alt: #e4e4e7;
  --color-text: #18181b;
  --color-text-muted: #71717a;
  --color-text-invert: #ffffff;
  --color-accent: #2563eb;
  --color-accent-sub: #60a5fa;
  --color-border: #d4d4d8;

  /* --- 색: 데이터 시각화 팔레트 (반드시 1→6 순서대로 사용) ------------ */
  --color-data-1: #2563eb;
  --color-data-2: #0ea5e9;
  --color-data-3: #14b8a6;
  --color-data-4: #f59e0b;
  --color-data-5: #ef4444;
  --color-data-6: #8b5cf6;

  /* --- 색: 상태 (테마 무관 고정) -------------------------------------- */
  --color-positive: #16a34a;
  --color-negative: #dc2626;
  --color-neutral: #71717a;

  /* --- 색: 반전 슬라이드 (전면 이미지 등 어두운 배경 1장용) ------------ */
  --color-bg-inverse: #0f172a;
  --color-text-on-inverse: #ffffff;
  --color-text-on-inverse-muted: #cbd5e1;

  /* --- 카드 보더 (Minimal Mono처럼 선으로 구분하는 테마만 1px로 올림) -- */
  --card-border-w: 0px;

  /* --- 라운드 --------------------------------------------------------- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* --- 그림자 (Figma 유실 방지: 다중 그림자 금지, 1개만) -------------- */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);

  /* --- 선 ------------------------------------------------------------- */
  --border-w: 1px;
  --border-w-thick: 3px;
}

/* ===== 03_ASSETS/css/02_slide_base.css — .component 캔버스만 ===== */
.component {
  width: 1400px;
  height: 700px;
  overflow: hidden;
  position: relative;
  /* 배경을 깔지 않는다 — 조합 빌더에서 여러 개를 겹쳐야 한다.
     흰색은 보여주는 쪽이 깐다: 아래 body · 갤러리 .thumb · 빌더 모눈지 */
  background: transparent;
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-m);
  line-height: var(--lh-body);
  margin: 0 auto;
  padding: var(--sp-6);
}

/* 파일을 단독으로 열었을 때만 흰 종이를 깐다 (00_reset.css의 회색을 덮는다).
   조합 빌더는 iframe 안에서 이 규칙을 끄고 노드를 투명하게 쓴다. */
body {
  background: var(--color-bg);
}

/* ===== 03_ASSETS/css/03_components.css ===== */
/* ==========================================================================
   03_components.css — 여러 다이어그램/슬라이드가 공유하는 최소 컴포넌트
   여기 있는 것만으로 다이어그램이 완성되지는 않는다. 반복되는 것만 올린다.
   ========================================================================== */

/* --- 카드 ------------------------------------------------------------ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-outlined {
  background: var(--color-bg);
  border: var(--border-w) solid var(--color-border);
}

.card-elevated {
  background: var(--color-bg);
  box-shadow: var(--shadow-sm);
}

/* --- 번호 배지 (프로세스 단계용) ------------------------------------- */
.step-num {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  color: var(--color-text-invert);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* --- 태그 / 배지 ----------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--color-surface-alt);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
}

.badge-accent {
  background: var(--color-accent);
  color: var(--color-text-invert);
}

/* --- 구분선 ---------------------------------------------------------- */
.divider {
  height: var(--border-w);
  background: var(--color-border);
  border: none;
}

.divider-accent {
  height: var(--border-w-thick);
  width: 96px;
  background: var(--color-accent);
}

/* --- 라벨 붙은 값 (KPI) ---------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.stat-value {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  color: var(--color-accent);
}

.stat-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  letter-spacing: var(--ls-wide);
}

/* --- 데이터 계열 색 (1~6 순서대로 사용) ------------------------------ */
.d1 { --c: var(--color-data-1); }
.d2 { --c: var(--color-data-2); }
.d3 { --c: var(--color-data-3); }
.d4 { --c: var(--color-data-4); }
.d5 { --c: var(--color-data-5); }
.d6 { --c: var(--color-data-6); }

.fill-data   { background: var(--c, var(--color-data-1)); }
.text-data   { color: var(--c, var(--color-data-1)); }
.border-data { border-color: var(--c, var(--color-data-1)); }

/* --- 정렬 유틸 ------------------------------------------------------- */
.items-center   { align-items: center; }
.items-start    { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grow           { flex: 1; }

/* ===== 이 다이어그램 전용 ===== */
    .component { width: 1200px; height: 800px; }

    .flow-title {
      font-size: var(--fs-h3);
      font-weight: var(--fw-semibold);
      margin-bottom: var(--sp-3);
    }

    /* 도형은 SVG, 글자는 HTML — 좌표를 맞추기 위해 absolute */
    .flow { position: relative; width: 1104px; height: 640px; }
    .flow-svg { position: absolute; left: 0; top: 0; }

    .flow-text {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      text-align: center;
      padding: 0 var(--sp-3);
    }
    .flow-label {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      line-height: 1.4;
    }
    .flow-sub {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      line-height: 1.4;
    }
    .flow-text.on-fill .flow-label { color: var(--color-text-invert); }
    .flow-text.on-fill .flow-sub { color: var(--color-text-invert); opacity: 0.8; }

    .flow-branch {
      position: absolute;
      font-size: var(--fs-caption);
      font-weight: var(--fw-bold);
      letter-spacing: var(--ls-wide);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <div class="component">
    <p class="flow-title">서비스 장애 대응 판단 흐름</p>

    <div class="flow">
      <svg class="flow-svg" width="1104" height="640" viewBox="0 0 1104 640" fill="none">
        <!-- 시작 -->
        <rect x="280" y="0" width="240" height="64" rx="32" fill="var(--color-data-1)"/>
        <!-- 판단 1 -->
        <polygon points="400,96 540,150 400,204 260,150" fill="var(--color-surface)"
                 stroke="var(--color-data-2)" stroke-width="3"/>
        <!-- 판단 2 -->
        <polygon points="400,286 540,340 400,394 260,340" fill="var(--color-surface)"
                 stroke="var(--color-data-2)" stroke-width="3"/>
        <!-- 처리 박스 -->
        <rect x="280" y="470" width="240" height="64" rx="8" fill="var(--color-bg)"
              stroke="var(--color-data-3)" stroke-width="3"/>
        <rect x="740" y="118" width="320" height="64" rx="8" fill="var(--color-bg)"
              stroke="var(--color-border)" stroke-width="2"/>
        <rect x="740" y="308" width="320" height="64" rx="8" fill="var(--color-bg)"
              stroke="var(--color-data-5)" stroke-width="3"/>
        <!-- 종료 -->
        <rect x="280" y="576" width="240" height="64" rx="32" fill="var(--color-data-1)"/>

        <!-- 시작 → 판단 1 -->
        <line x1="400" y1="64" x2="400" y2="82" stroke="var(--color-border)" stroke-width="3"/>
        <polygon points="392,82 408,82 400,96" fill="var(--color-border)"/>
        <!-- 판단 1 → 아니오 -->
        <line x1="540" y1="150" x2="726" y2="150" stroke="var(--color-border)" stroke-width="3"/>
        <polygon points="726,142 726,158 740,150" fill="var(--color-border)"/>
        <!-- 판단 1 → 예 -->
        <line x1="400" y1="204" x2="400" y2="272" stroke="var(--color-border)" stroke-width="3"/>
        <polygon points="392,272 408,272 400,286" fill="var(--color-border)"/>
        <!-- 판단 2 → 아니오 -->
        <line x1="540" y1="340" x2="726" y2="340" stroke="var(--color-border)" stroke-width="3"/>
        <polygon points="726,332 726,348 740,340" fill="var(--color-border)"/>
        <!-- 판단 2 → 예 -->
        <line x1="400" y1="394" x2="400" y2="456" stroke="var(--color-border)" stroke-width="3"/>
        <polygon points="392,456 408,456 400,470" fill="var(--color-border)"/>
        <!-- 즉시 복구 → 종료 -->
        <line x1="400" y1="534" x2="400" y2="562" stroke="var(--color-border)" stroke-width="3"/>
        <polygon points="392,562 408,562 400,576" fill="var(--color-border)"/>
        <!-- 일반 티켓 → 종료 (우측 우회) -->
        <polyline points="1060,150 1080,150 1080,608 534,608" stroke="var(--color-border)"
                  stroke-width="3" fill="none"/>
        <polygon points="534,600 534,616 520,608" fill="var(--color-border)"/>
        <!-- 인시던트 선포 → 종료 -->
        <polyline points="900,372 900,608 534,608" stroke="var(--color-border)"
                  stroke-width="3" fill="none"/>
      </svg>

      <div class="flow-text on-fill" style="left: 280px; top: 0; width: 240px; height: 64px;">
        <p class="flow-label">장애 신고 접수</p>
      </div>

      <div class="flow-text" style="left: 260px; top: 96px; width: 280px; height: 108px;">
        <p class="flow-label">고객 서비스에 영향이 있는가?</p>
      </div>

      <div class="flow-text" style="left: 260px; top: 286px; width: 280px; height: 108px;">
        <p class="flow-label">30분 안에 복구 가능한가?</p>
      </div>

      <div class="flow-text" style="left: 740px; top: 118px; width: 320px; height: 64px;">
        <p class="flow-label">일반 티켓 등록</p>
        <p class="flow-sub">익일 정기 배포에 포함</p>
      </div>

      <div class="flow-text" style="left: 740px; top: 308px; width: 320px; height: 64px;">
        <p class="flow-label">인시던트 선포 · 상황실 가동</p>
        <p class="flow-sub">CTO 즉시 보고 · 고객 공지</p>
      </div>

      <div class="flow-text" style="left: 280px; top: 470px; width: 240px; height: 64px;">
        <p class="flow-label">담당자 즉시 조치</p>
      </div>

      <div class="flow-text on-fill" style="left: 280px; top: 576px; width: 240px; height: 64px;">
        <p class="flow-label">원인 리포트 작성 후 종료</p>
      </div>

      <span class="flow-branch" style="left: 590px; top: 116px;">아니오</span>
      <span class="flow-branch" style="left: 416px; top: 224px;">예</span>
      <span class="flow-branch" style="left: 590px; top: 306px;">아니오</span>
      <span class="flow-branch" style="left: 416px; top: 412px;">예</span>
    </div>
  </div>
</body>
</html>
