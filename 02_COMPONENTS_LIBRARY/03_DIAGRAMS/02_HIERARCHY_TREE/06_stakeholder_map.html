<!-- @card 이해관계자 맵 | 중심 조직 + 위성 노드 + 관계선 굵기 차등 | 1200x900 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이해관계자 맵</title>
    <!-- 자기완결형: CSS 전체를 아래에 인라인했다. 외부 링크 없음.
       공통 토큰을 고치려면 03_ASSETS/css/를 고친 뒤 이 블록도 함께 갱신한다. -->
  <style>
/* ===== 03_ASSETS/css/00_reset.css ===== */
/* ==========================================================================
   00_reset.css — 슬라이드 전용 최소 리셋
   normalize.css를 쓰지 않는 이유: 범용 규칙이 Figma 레이어에 노이즈를 더한다.
   로드 순서: 00_reset → 01_variables → 02_slide_base → 03_components → 테마 토큰
   ========================================================================== */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* rem을 쓰지 않지만, 브라우저 기본 확대 설정의 영향을 없애기 위해 고정 */
  font-size: 16px;
}

body {
  background: #52525b;              /* 캔버스 밖 회색 — 슬라이드 경계를 눈으로 구분 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

th {
  text-align: left;
  font-weight: inherit;
}

/* 슬라이드는 정적 캡처 대상 — 애니메이션은 최종 상태로 고정한다 */
*,
*::before,
*::after {
  animation: none !important;
  transition: none !important;
}

/* ===== 03_ASSETS/css/01_variables.css ===== */
/* ==========================================================================
   01_variables.css — 디자인 토큰 단일 소스
   규칙: 의미 기반 이름만 쓴다 (--blue-500 X / --color-accent O)
   테마 교체는 같은 변수명을 덮어쓰는 방식. 슬라이드는 .v1/.v2/.v3 클래스에 건다.
   상세: 00_GUIDES/02_DESIGN_SYSTEM.md
   ========================================================================== */

:root {
  /* --- 캔버스 --------------------------------------------------------- */
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-pad: 96px;               /* 세이프 영역 */
  --content-w: 1728px;             /* 1920 - 96*2 */
  --content-h: 888px;              /* 1080 - 96*2 */
  --grid-cols: 12;
  --grid-gutter: 32px;

  /* --- 폰트 ----------------------------------------------------------- */
  --font-sans: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  --font-serif: "Noto Serif KR", Georgia, serif;
  --font-kicker: var(--font-sans);  /* 라벨/킥커 전용 훅 — 대부분 본문과 동일, 럭셔리 계열만 세리프로 교체 */

  /* --- 타입 스케일 (1080p 프로젝터 기준 / 최소 18px) ------------------- */
  --fs-display: 96px;
  --fs-h1: 64px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-body-l: 28px;
  --fs-body-m: 24px;
  --fs-caption: 18px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* line-height만 배수 사용 — 폰트 교체에 강하다 */
  --lh-tight: 1.2;
  --lh-heading: 1.3;
  --lh-body: 1.6;

  --ls-tight: -0.02em;             /* 48px 이상 대제목 */
  --ls-normal: 0;
  --ls-wide: 0.05em;               /* 대문자 라벨 */

  /* --- 간격 (8px 배수) ------------------------------------------------ */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 48px;
  --sp-7: 64px;
  --sp-8: 96px;
  --sp-9: 128px;

  /* --- 색: 시맨틱 (테마마다 값이 바뀜) -------------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-surface-alt: #e4e4e7;
  --color-text: #18181b;
  --color-text-muted: #71717a;
  --color-text-invert: #ffffff;
  --color-accent: #2563eb;
  --color-accent-sub: #60a5fa;
  --color-border: #d4d4d8;

  /* --- 색: 데이터 시각화 팔레트 (반드시 1→6 순서대로 사용) ------------ */
  --color-data-1: #2563eb;
  --color-data-2: #0ea5e9;
  --color-data-3: #14b8a6;
  --color-data-4: #f59e0b;
  --color-data-5: #ef4444;
  --color-data-6: #8b5cf6;

  /* --- 색: 상태 (테마 무관 고정) -------------------------------------- */
  --color-positive: #16a34a;
  --color-negative: #dc2626;
  --color-neutral: #71717a;

  /* --- 색: 반전 슬라이드 (전면 이미지 등 어두운 배경 1장용) ------------ */
  --color-bg-inverse: #0f172a;
  --color-text-on-inverse: #ffffff;
  --color-text-on-inverse-muted: #cbd5e1;

  /* --- 카드 보더 (Minimal Mono처럼 선으로 구분하는 테마만 1px로 올림) -- */
  --card-border-w: 0px;

  /* --- 라운드 --------------------------------------------------------- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* --- 그림자 (Figma 유실 방지: 다중 그림자 금지, 1개만) -------------- */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);

  /* --- 선 ------------------------------------------------------------- */
  --border-w: 1px;
  --border-w-thick: 3px;
}

/* ===== 03_ASSETS/css/02_slide_base.css — .component 캔버스만 ===== */
.component {
  width: 1400px;
  height: 700px;
  overflow: hidden;
  position: relative;
  /* 배경을 깔지 않는다 — 조합 빌더에서 여러 개를 겹쳐야 한다.
     흰색은 보여주는 쪽이 깐다: 아래 body · 갤러리 .thumb · 빌더 모눈지 */
  background: transparent;
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-m);
  line-height: var(--lh-body);
  margin: 0 auto;
  padding: var(--sp-6);
}

/* 파일을 단독으로 열었을 때만 흰 종이를 깐다 (00_reset.css의 회색을 덮는다).
   조합 빌더는 iframe 안에서 이 규칙을 끄고 노드를 투명하게 쓴다. */
body {
  background: var(--color-bg);
}

/* ===== 03_ASSETS/css/03_components.css ===== */
/* ==========================================================================
   03_components.css — 여러 다이어그램/슬라이드가 공유하는 최소 컴포넌트
   여기 있는 것만으로 다이어그램이 완성되지는 않는다. 반복되는 것만 올린다.
   ========================================================================== */

/* --- 카드 ------------------------------------------------------------ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-outlined {
  background: var(--color-bg);
  border: var(--border-w) solid var(--color-border);
}

.card-elevated {
  background: var(--color-bg);
  box-shadow: var(--shadow-sm);
}

/* --- 번호 배지 (프로세스 단계용) ------------------------------------- */
.step-num {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  color: var(--color-text-invert);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* --- 태그 / 배지 ----------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--color-surface-alt);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
}

.badge-accent {
  background: var(--color-accent);
  color: var(--color-text-invert);
}

/* --- 구분선 ---------------------------------------------------------- */
.divider {
  height: var(--border-w);
  background: var(--color-border);
  border: none;
}

.divider-accent {
  height: var(--border-w-thick);
  width: 96px;
  background: var(--color-accent);
}

/* --- 라벨 붙은 값 (KPI) ---------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.stat-value {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  color: var(--color-accent);
}

.stat-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  letter-spacing: var(--ls-wide);
}

/* --- 데이터 계열 색 (1~6 순서대로 사용) ------------------------------ */
.d1 { --c: var(--color-data-1); }
.d2 { --c: var(--color-data-2); }
.d3 { --c: var(--color-data-3); }
.d4 { --c: var(--color-data-4); }
.d5 { --c: var(--color-data-5); }
.d6 { --c: var(--color-data-6); }

.fill-data   { background: var(--c, var(--color-data-1)); }
.text-data   { color: var(--c, var(--color-data-1)); }
.border-data { border-color: var(--c, var(--color-data-1)); }

/* --- 정렬 유틸 ------------------------------------------------------- */
.items-center   { align-items: center; }
.items-start    { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grow           { flex: 1; }

/* ===== 이 다이어그램 전용 ===== */
    .component { width: 1200px; height: 900px; }

    /* 관계선(SVG)과 노드 좌표를 맞추기 위해 absolute 배치 */
    .stake { position: relative; width: 1104px; height: 804px; }
    .stake-svg { position: absolute; left: 0; top: 0; }

    .stake-core {
      position: absolute;
      left: 412px; top: 342px;
      width: 280px; height: 120px;
      border-radius: var(--radius-md);
      background: var(--color-accent);
      color: var(--color-text-invert);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      text-align: center;
    }
    .stake-core-name {
      font-size: var(--fs-h3);
      font-weight: var(--fw-bold);
    }
    .stake-core-sub {
      font-size: var(--fs-caption);
      opacity: 0.85;
    }

    .stake-node {
      position: absolute;
      width: 220px; height: 84px;
      border-radius: var(--radius-sm);
      background: var(--color-bg);
      border: var(--border-w) solid var(--color-border);
      padding: var(--sp-3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--sp-1);
      text-align: center;
    }
    .stake-node.is-key {
      background: var(--color-surface);
      border: none;
      border-bottom: var(--border-w-thick) solid var(--c, var(--color-data-1));
    }
    .stake-name {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      line-height: 1.3;
    }
    .stake-role {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="component">
    <div class="stake">

      <!-- 선 굵기 = 영향도 (6 높음 / 4 중간 / 2 낮음) -->
      <svg class="stake-svg" width="1104" height="804" viewBox="0 0 1104 804" fill="none">
        <line x1="552" y1="402" x2="552" y2="60"  stroke="var(--color-data-1)" stroke-width="6"/>
        <line x1="552" y1="402" x2="900" y2="140" stroke="var(--color-border)"  stroke-width="2"/>
        <line x1="552" y1="402" x2="982" y2="402" stroke="var(--color-data-2)" stroke-width="6"/>
        <line x1="552" y1="402" x2="900" y2="664" stroke="var(--color-border)"  stroke-width="4"/>
        <line x1="552" y1="402" x2="552" y2="744" stroke="var(--color-data-3)" stroke-width="6"/>
        <line x1="552" y1="402" x2="204" y2="664" stroke="var(--color-border)"  stroke-width="2"/>
        <line x1="552" y1="402" x2="122" y2="402" stroke="var(--color-data-4)" stroke-width="4"/>
        <line x1="552" y1="402" x2="204" y2="140" stroke="var(--color-border)"  stroke-width="4"/>
      </svg>

      <div class="stake-core">
        <p class="stake-core-name">스마트팩토리 TF</p>
        <p class="stake-core-sub">공장 자동화 전환 과제</p>
      </div>

      <div class="stake-node is-key d1" style="left: 442px; top: 18px;">
        <p class="stake-name">경영진 · 투자심의위</p>
        <p class="stake-role">예산 승인 · 영향도 높음</p>
      </div>
      <div class="stake-node" style="left: 790px; top: 98px;">
        <p class="stake-name">그룹 감사팀</p>
        <p class="stake-role">사후 점검 · 영향도 낮음</p>
      </div>
      <div class="stake-node is-key d2" style="left: 872px; top: 360px;">
        <p class="stake-name">생산 현장 리더</p>
        <p class="stake-role">실행 주체 · 영향도 높음</p>
      </div>
      <div class="stake-node" style="left: 790px; top: 622px;">
        <p class="stake-name">설비 공급사</p>
        <p class="stake-role">납기 · 영향도 중간</p>
      </div>
      <div class="stake-node is-key d3" style="left: 442px; top: 702px;">
        <p class="stake-name">노동조합</p>
        <p class="stake-role">인력 재배치 협의 · 높음</p>
      </div>
      <div class="stake-node" style="left: 94px; top: 622px;">
        <p class="stake-name">지역 사회 · 지자체</p>
        <p class="stake-role">인허가 · 영향도 낮음</p>
      </div>
      <div class="stake-node is-key d4" style="left: 12px; top: 360px;">
        <p class="stake-name">IT 인프라팀</p>
        <p class="stake-role">시스템 연동 · 중간</p>
      </div>
      <div class="stake-node" style="left: 94px; top: 98px;">
        <p class="stake-name">품질보증팀</p>
        <p class="stake-role">공정 검증 · 영향도 중간</p>
      </div>

    </div>
  </div>
</body>
</html>
