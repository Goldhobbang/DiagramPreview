<!-- @card 생키 흐름 | 유입에서 결과까지 폭=값 흐름 배분 | 1600x800 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>생키 흐름</title>
  <!-- 자기완결형: CSS 전체를 아래에 인라인했다. 외부 링크 없음.
       공통 토큰을 고치려면 03_ASSETS/css/를 고친 뒤 이 블록도 함께 갱신한다. -->
  <style>
/* ===== 03_ASSETS/css/00_reset.css ===== */
/* ==========================================================================
   00_reset.css — 슬라이드 전용 최소 리셋
   normalize.css를 쓰지 않는 이유: 범용 규칙이 Figma 레이어에 노이즈를 더한다.
   로드 순서: 00_reset → 01_variables → 02_slide_base → 03_components → 테마 토큰
   ========================================================================== */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* rem을 쓰지 않지만, 브라우저 기본 확대 설정의 영향을 없애기 위해 고정 */
  font-size: 16px;
}

body {
  background: #52525b;              /* 캔버스 밖 회색 — 슬라이드 경계를 눈으로 구분 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

th {
  text-align: left;
  font-weight: inherit;
}

/* 슬라이드는 정적 캡처 대상 — 애니메이션은 최종 상태로 고정한다 */
*,
*::before,
*::after {
  animation: none !important;
  transition: none !important;
}

/* ===== 03_ASSETS/css/01_variables.css ===== */
/* ==========================================================================
   01_variables.css — 디자인 토큰 단일 소스
   규칙: 의미 기반 이름만 쓴다 (--blue-500 X / --color-accent O)
   테마 교체는 같은 변수명을 덮어쓰는 방식. 슬라이드는 .v1/.v2/.v3 클래스에 건다.
   상세: 00_GUIDES/02_DESIGN_SYSTEM.md
   ========================================================================== */

:root {
  /* --- 캔버스 --------------------------------------------------------- */
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-pad: 96px;               /* 세이프 영역 */
  --content-w: 1728px;             /* 1920 - 96*2 */
  --content-h: 888px;              /* 1080 - 96*2 */
  --grid-cols: 12;
  --grid-gutter: 32px;

  /* --- 폰트 ----------------------------------------------------------- */
  --font-sans: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  --font-serif: "Noto Serif KR", Georgia, serif;
  --font-kicker: var(--font-sans);  /* 라벨/킥커 전용 훅 — 대부분 본문과 동일, 럭셔리 계열만 세리프로 교체 */

  /* --- 타입 스케일 (1080p 프로젝터 기준 / 최소 18px) ------------------- */
  --fs-display: 96px;
  --fs-h1: 64px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-body-l: 28px;
  --fs-body-m: 24px;
  --fs-caption: 18px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* line-height만 배수 사용 — 폰트 교체에 강하다 */
  --lh-tight: 1.2;
  --lh-heading: 1.3;
  --lh-body: 1.6;

  --ls-tight: -0.02em;             /* 48px 이상 대제목 */
  --ls-normal: 0;
  --ls-wide: 0.05em;               /* 대문자 라벨 */

  /* --- 간격 (8px 배수) ------------------------------------------------ */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 48px;
  --sp-7: 64px;
  --sp-8: 96px;
  --sp-9: 128px;

  /* --- 색: 시맨틱 (테마마다 값이 바뀜) -------------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-surface-alt: #e4e4e7;
  --color-text: #18181b;
  --color-text-muted: #71717a;
  --color-text-invert: #ffffff;
  --color-accent: #2563eb;
  --color-accent-sub: #60a5fa;
  --color-border: #d4d4d8;

  /* --- 색: 데이터 시각화 팔레트 (반드시 1→6 순서대로 사용) ------------ */
  --color-data-1: #2563eb;
  --color-data-2: #0ea5e9;
  --color-data-3: #14b8a6;
  --color-data-4: #f59e0b;
  --color-data-5: #ef4444;
  --color-data-6: #8b5cf6;

  /* --- 색: 상태 (테마 무관 고정) -------------------------------------- */
  --color-positive: #16a34a;
  --color-negative: #dc2626;
  --color-neutral: #71717a;

  /* --- 색: 반전 슬라이드 (전면 이미지 등 어두운 배경 1장용) ------------ */
  --color-bg-inverse: #0f172a;
  --color-text-on-inverse: #ffffff;
  --color-text-on-inverse-muted: #cbd5e1;

  /* --- 카드 보더 (Minimal Mono처럼 선으로 구분하는 테마만 1px로 올림) -- */
  --card-border-w: 0px;

  /* --- 라운드 --------------------------------------------------------- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* --- 그림자 (Figma 유실 방지: 다중 그림자 금지, 1개만) -------------- */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);

  /* --- 선 ------------------------------------------------------------- */
  --border-w: 1px;
  --border-w-thick: 3px;
}

/* ===== 03_ASSETS/css/02_slide_base.css — .component 캔버스만 ===== */
.component {
  width: 1400px;
  height: 700px;
  overflow: hidden;
  position: relative;
  /* 배경을 깔지 않는다 — 조합 빌더에서 여러 개를 겹쳐야 한다.
     흰색은 보여주는 쪽이 깐다: 아래 body · 갤러리 .thumb · 빌더 모눈지 */
  background: transparent;
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-m);
  line-height: var(--lh-body);
  margin: 0 auto;
  padding: var(--sp-6);
}

/* 파일을 단독으로 열었을 때만 흰 종이를 깐다 (00_reset.css의 회색을 덮는다).
   조합 빌더는 iframe 안에서 이 규칙을 끄고 노드를 투명하게 쓴다. */
body {
  background: var(--color-bg);
}

/* ===== 03_ASSETS/css/03_components.css ===== */
/* ==========================================================================
   03_components.css — 여러 다이어그램/슬라이드가 공유하는 최소 컴포넌트
   여기 있는 것만으로 다이어그램이 완성되지는 않는다. 반복되는 것만 올린다.
   ========================================================================== */

/* --- 카드 ------------------------------------------------------------ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-outlined {
  background: var(--color-bg);
  border: var(--border-w) solid var(--color-border);
}

.card-elevated {
  background: var(--color-bg);
  box-shadow: var(--shadow-sm);
}

/* --- 번호 배지 (프로세스 단계용) ------------------------------------- */
.step-num {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  color: var(--color-text-invert);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* --- 태그 / 배지 ----------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--color-surface-alt);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
}

.badge-accent {
  background: var(--color-accent);
  color: var(--color-text-invert);
}

/* --- 구분선 ---------------------------------------------------------- */
.divider {
  height: var(--border-w);
  background: var(--color-border);
  border: none;
}

.divider-accent {
  height: var(--border-w-thick);
  width: 96px;
  background: var(--color-accent);
}

/* --- 라벨 붙은 값 (KPI) ---------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.stat-value {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  color: var(--color-accent);
}

.stat-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  letter-spacing: var(--ls-wide);
}

/* --- 데이터 계열 색 (1~6 순서대로 사용) ------------------------------ */
.d1 { --c: var(--color-data-1); }
.d2 { --c: var(--color-data-2); }
.d3 { --c: var(--color-data-3); }
.d4 { --c: var(--color-data-4); }
.d5 { --c: var(--color-data-5); }
.d6 { --c: var(--color-data-6); }

.fill-data   { background: var(--c, var(--color-data-1)); }
.text-data   { color: var(--c, var(--color-data-1)); }
.border-data { border-color: var(--c, var(--color-data-1)); }

/* --- 정렬 유틸 ------------------------------------------------------- */
.items-center   { align-items: center; }
.items-start    { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grow           { flex: 1; }
/* ===== 이 다이어그램 전용 ===== */
    .component { width: 1600px; height: 800px; }

    .sk-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); }
    .sk-sub {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      margin: var(--sp-1) 0 var(--sp-4);
    }

    /* 띠와 노드 막대는 SVG, 글자는 HTML — 좌표를 맞추기 위해 absolute.
       스케일: 총 1,000건 = 600px (1건 = 0.6px) */
    .sk { position: relative; width: 1504px; height: 600px; }
    .sk-svg { position: absolute; left: 0; top: 0; }

    .sk-label {
      position: absolute;
      font-size: var(--fs-caption);
      line-height: 1.35;
      white-space: nowrap;
    }
    .sk-label b {
      display: block;
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
    }
    .sk-label .n {
      color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
    }
    .sk-stage {
      position: absolute;
      font-size: var(--fs-caption);
      font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-wide);
      color: var(--color-text-muted);
    }

    .sk-note {
      margin-top: var(--sp-4);
      padding-top: var(--sp-3);
      border-top: var(--border-w) solid var(--color-border);
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
    }
    .sk-note b { color: var(--color-text); font-weight: var(--fw-semibold); }
  </style>
</head>
<body>
  <div class="component">
    <p class="sk-title">기안 문서 1,000건의 처리 경로</p>
    <p class="sk-sub">단위: 건 · 2025년 12월 · 띠 두께 = 건수</p>

    <div class="sk">
      <svg class="sk-svg" width="1504" height="600" viewBox="0 0 1504 600" fill="none">
        <!-- 1단 노드: 유입 채널 -->
        <rect x="0" y="30"  width="18" height="288" rx="4" fill="var(--color-data-1)"/>
        <rect x="0" y="338" width="18" height="180" rx="4" fill="var(--color-data-2)"/>
        <rect x="0" y="538" width="18" height="42"  rx="4" fill="var(--color-data-6)"/>

        <!-- 2단 노드: 심사 -->
        <rect x="700" y="30"  width="18" height="420" rx="4" fill="var(--color-accent)"/>
        <rect x="700" y="470" width="18" height="110" rx="4" fill="var(--color-data-4)"/>

        <!-- 3단 노드: 결과 -->
        <rect x="1400" y="30"  width="18" height="336" rx="4" fill="var(--color-positive)"/>
        <rect x="1400" y="386" width="18" height="120" rx="4" fill="var(--color-data-4)"/>
        <rect x="1400" y="526" width="18" height="54"  rx="4" fill="var(--color-negative)"/>

        <!-- 1단 → 2단 띠 (곡선 폭 = 건수). 웹 480건 중 420 정상심사 / 60 보류 -->
        <path d="M18 30 C360 30 360 30 700 30 L700 282 C360 282 360 318 18 318 Z"
              fill="var(--color-data-1)" opacity=".35"/>
        <path d="M18 318 C360 318 360 512 700 512 L700 470 C360 470 360 282 18 282 Z"
              fill="var(--color-data-1)" opacity=".18"/>
        <!-- 모바일 300건 → 282~432 정상 / 나머지 보류 -->
        <path d="M18 338 C360 338 360 282 700 282 L700 402 C360 402 360 458 18 458 Z"
              fill="var(--color-data-2)" opacity=".35"/>
        <path d="M18 458 C360 458 360 512 700 512 L700 552 C360 552 360 518 18 518 Z"
              fill="var(--color-data-2)" opacity=".18"/>
        <!-- 대리 기안 70건 -->
        <path d="M18 538 C360 538 360 402 700 402 L700 450 C360 450 360 580 18 580 Z"
              fill="var(--color-data-6)" opacity=".35"/>

        <!-- 2단 → 3단 띠. 정상심사 700건 → 승인 560 / 조건부 100 / 반려 40 -->
        <path d="M718 30 C1060 30 1060 30 1400 30 L1400 366 C1060 366 1060 366 718 366 Z"
              fill="var(--color-positive)" opacity=".3"/>
        <path d="M718 366 C1060 366 1060 386 1400 386 L1400 446 C1060 446 1060 426 718 426 Z"
              fill="var(--color-data-4)" opacity=".35"/>
        <path d="M718 426 C1060 426 1060 526 1400 526 L1400 556 C1060 556 1060 450 718 450 Z"
              fill="var(--color-negative)" opacity=".3"/>
        <!-- 보류 300건 → 조건부 60 / 반려 24 -->
        <path d="M718 470 C1060 470 1060 446 1400 446 L1400 506 C1060 506 1060 530 718 530 Z"
              fill="var(--color-data-4)" opacity=".18"/>
        <path d="M718 530 C1060 530 1060 556 1400 556 L1400 580 C1060 580 1060 580 718 580 Z"
              fill="var(--color-negative)" opacity=".18"/>
      </svg>

      <span class="sk-stage" style="left: 0; top: 0;">유입 채널</span>
      <span class="sk-stage" style="left: 680px; top: 0;">1차 심사</span>
      <span class="sk-stage" style="left: 1330px; top: 0;">최종 결과</span>

      <span class="sk-label" data-anchor="src-1" style="left: 30px; top: 150px;">
        <b>웹 기안</b><span class="n">480건 · 48%</span></span>
      <span class="sk-label" data-anchor="src-2" style="left: 30px; top: 400px;">
        <b>모바일 기안</b><span class="n">300건 · 30%</span></span>
      <span class="sk-label" data-anchor="src-3" style="left: 30px; top: 540px;">
        <b>대리 기안</b><span class="n">220건 · 22%</span></span>

      <span class="sk-label" data-anchor="mid-1" style="left: 560px; top: 190px;">
        <b>당일 심사</b><span class="n">700건</span></span>
      <span class="sk-label" data-anchor="mid-2" style="left: 560px; top: 500px;">
        <b>보류 · 재요청</b><span class="n">300건</span></span>

      <span class="sk-label" data-anchor="dst-1" style="left: 1430px; top: 180px;">
        <b>승인 완료</b><span class="n">560건 · 56%</span></span>
      <span class="sk-label" data-anchor="dst-2" style="left: 1430px; top: 420px;">
        <b>조건부 승인</b><span class="n">280건 · 28%</span></span>
      <span class="sk-label" data-anchor="dst-3" style="left: 1430px; top: 540px;">
        <b>반려</b><span class="n">160건 · 16%</span></span>
    </div>

    <p class="sk-note">
      보류로 빠진 <b>300건 중 절반 이상이 대리 기안</b>이다 — 대리 권한 확인 절차가 병목.
      진한 띠는 1차 심사를 당일 통과한 경로, 흐린 띠는 보류를 거친 경로다.
    </p>
  </div>
</body>
</html>
