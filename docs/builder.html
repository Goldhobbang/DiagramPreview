<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조합 빌더 — Figma PPT System Docs</title>
<!-- ?v= 수동 갱신 -->
<link rel="stylesheet" href="builder.css?v=7">
</head>
<body>

<header class="top">
  <div class="nav-links">
    <a class="back-link" href="../">홈</a>
    <a class="back-link" href="index.html">← 갤러리</a>
  </div>
  <div class="title-wrap">
    <div class="title-row">
      <span class="badge">BUILDER</span>
      <h1>다이어그램 조합 빌더</h1>
    </div>
    <p class="sub">다이어그램을 조합하여 1장의 완성형 슬라이드 구조 생성 · 자동 스냅 지원</p>
  </div>

  <div class="tools-bar" role="toolbar" aria-label="캔버스 편집 도구">
    <div class="btn-group">
      <button type="button" id="fit" title="캔버스 전체 맞춤">전체 보기</button>
    </div>
    <span class="divider"></span>
    <div class="btn-group">
      <button type="button" id="front">맨 앞으로</button>
      <button type="button" id="back-z">맨 뒤로</button>
      <button type="button" id="dup">복제</button>
      <button type="button" id="del" class="btn-danger">삭제</button>
    </div>
    <span class="divider"></span>
    <div class="btn-group">
      <button type="button" id="clear">캔버스 비우기</button>
      <button type="button" id="save-json">JSON 저장</button>
      <button type="button" id="load-json">JSON 불러오기</button>
    </div>
    <span class="divider"></span>
    <button type="button" id="export" class="btn-export">HTML 내보내기</button>
  </div>
</header>

<div class="work-area">
  <aside class="palette">
    <div class="palette-header">
      <input type="search" id="search" placeholder="부품 검색 (이름, 용도)…" autocomplete="off">
      <div class="pal-tabs" id="pal-tabs" role="tablist" aria-label="카테고리"></div>
      <p class="pal-hint" id="pal-hint">부품을 클릭하면 캔버스 중앙에 배치됩니다.</p>
    </div>
    <div class="pal-list" id="pal-list"></div>
  </aside>

  <main class="canvas-wrap" id="canvas-wrap">
    <div class="stage" id="stage">
      <div class="guides" id="guides"></div>
    </div>
    <div class="empty-hint" id="empty-hint">
      <div class="empty-hint-card">
        <h3>캔버스가 비어 있습니다</h3>
        <p>왼쪽 팔레트에서 원하는 다이어그램이나 컴포넌트를 클릭해 추가하세요.</p>
      </div>
    </div>
    <div class="statusbar">
      <span id="status">노드 0개</span>
      <span class="shortcuts">단축키: Alt(자유 배율) · Shift(스냅 해제) · Space+드래그(화면 이동) · Del(삭제) · 방향키(이동)</span>
    </div>
  </main>
</div>

<input type="file" id="file-input" accept="application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="builder.js?v=7"></script>
</body>
</html>
