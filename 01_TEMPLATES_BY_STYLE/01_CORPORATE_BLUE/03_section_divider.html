<!-- @card 섹션 구분 | 장 표지. 큰 번호 + 섹션명 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>섹션 구분</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    .slide { background: var(--color-surface); }

    /* 우측 상단 초대형 고스트 번호 — 이 슬라이드의 유일한 장식 */
    .ghost-num {
      position: absolute;
      right: 48px;
      top: -64px;
      font-size: 560px;
      font-weight: var(--fw-bold);
      line-height: 1;
      letter-spacing: var(--ls-tight);
      color: var(--color-text);
      opacity: 0.06;
    }

    .divider-inner { justify-content: flex-end; gap: var(--sp-5); }
    .section-kicker {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      color: var(--color-accent);
      letter-spacing: var(--ls-wide);
    }
    .section-title { max-width: 1200px; }
    .section-desc {
      font-size: var(--fs-h3);
      font-weight: var(--fw-regular);
      color: var(--color-text-muted);
      line-height: 1.5;
      max-width: 1000px;
    }

    .section-progress {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-top: var(--sp-6);
    }
    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: var(--radius-full);
      background: var(--color-border);
    }
    .progress-dot.active {
      width: 56px;
      background: var(--gradient-accent, var(--color-accent));
    }
    .progress-label {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      letter-spacing: var(--ls-wide);
      margin-left: var(--sp-2);
    }
  </style>
</head>
<body>
  <div class="slide">
    <p class="ghost-num">02</p>
    <div class="slide-inner divider-inner">

      <p class="section-kicker">SECTION 02</p>
      <h1 class="t-display section-title">전략 방향</h1>
      <p class="section-desc">시장 진단에서 도출한 3대 전략 축과 목표 지표를 정의한다</p>

      <div class="section-progress">
        <div class="progress-dot"></div>
        <div class="progress-dot active"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <p class="progress-label">2 / 4</p>
      </div>

    </div>
  </div>
</body>
</html>
