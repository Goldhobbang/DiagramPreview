<!-- @card 표지 | 제목 · 부제 · 발표자 · 날짜 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>표지</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    /* 좌측 어깨의 얇은 액센트 바 — 파랑 면적은 최소로 */
    .cover-edge {
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 1080px;
      background: var(--color-accent);
    }
    .cover-inner { justify-content: space-between; }
    .cover-head { display: flex; align-items: center; gap: var(--sp-3); }
    .cover-org {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-wide);
      color: var(--color-text-muted);
    }
    .cover-main {
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
    }
    .cover-kicker {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      color: var(--color-accent);
      letter-spacing: var(--ls-wide);
    }
    .cover-title { max-width: 1400px; }
    .cover-sub {
      font-size: var(--fs-h3);
      font-weight: var(--fw-regular);
      color: var(--color-text-muted);
      line-height: 1.5;
    }
    .cover-foot {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-top: var(--border-w) solid var(--color-border);
      padding-top: var(--sp-4);
    }
    .cover-meta { display: flex; gap: var(--sp-7); }
    .cover-meta-item { display: flex; flex-direction: column; gap: var(--sp-1); }
    .cover-meta-label {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      letter-spacing: var(--ls-wide);
    }
    .cover-meta-value {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="cover-edge"></div>
    <div class="slide-inner cover-inner">

      <div class="cover-head">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="2" y="2" width="16" height="16" rx="3" fill="var(--color-accent)"/>
          <rect x="22" y="2" width="16" height="16" rx="3" fill="var(--color-accent-sub)"/>
          <rect x="2" y="22" width="16" height="16" rx="3" fill="var(--color-accent-sub)"/>
          <rect x="22" y="22" width="16" height="16" rx="3" fill="var(--color-accent)"/>
        </svg>
        <p class="cover-org">ACME CORPORATION</p>
      </div>

      <div class="cover-main">
        <p class="cover-kicker">2026 하반기 전략 보고</p>
        <h1 class="t-display cover-title">데이터 기반 성장 전략과<br>핵심 실행 과제</h1>
        <p class="cover-sub">시장 환경 진단 · 3대 전략 방향 · 분기별 실행 로드맵</p>
      </div>

      <div class="cover-foot">
        <div class="cover-meta">
          <div class="cover-meta-item">
            <p class="cover-meta-label">발표자</p>
            <p class="cover-meta-value">전략기획팀 김민준 팀장</p>
          </div>
          <div class="cover-meta-item">
            <p class="cover-meta-label">일자</p>
            <p class="cover-meta-value">2026. 08. 20</p>
          </div>
        </div>
        <p class="t-caption">대외비 · 사내 공유용</p>
      </div>

    </div>
  </div>
</body>
</html>
