<!-- @card 마무리 | Q&A / 연락처 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마무리</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    /* 하단 액센트 엣지 — 표지의 룰과 짝을 이룬다 */
    .closing-edge {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1920px;
      height: 16px;
      background: var(--gradient-accent, var(--color-accent));
    }

    .closing-inner { justify-content: space-between; }

    .closing-head { display: flex; align-items: center; justify-content: space-between; }
    .closing-org {
      font-size: var(--fs-caption);
      font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-wide);
      color: var(--color-text-muted);
    }

    .closing-main { display: flex; flex-direction: column; gap: var(--sp-4); }
    .closing-kicker {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      color: var(--color-accent);
      letter-spacing: var(--ls-wide);
    }
    .closing-sub {
      font-size: var(--fs-h3);
      font-weight: var(--fw-regular);
      color: var(--color-text-muted);
      line-height: 1.5;
    }

    .contact-row {
      display: flex;
      gap: var(--sp-8);
      border-top: var(--border-w) solid var(--color-border);
      padding-top: var(--sp-5);
    }
    .contact-item { display: flex; flex-direction: column; gap: var(--sp-2); }
    .contact-label {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      letter-spacing: var(--ls-wide);
    }
    .contact-value {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-inner closing-inner">

      <div class="closing-head">
        <p class="closing-org">ACME CORPORATION</p>
        <p class="closing-org">2026 하반기 전략 보고</p>
      </div>

      <div class="closing-main">
        <p class="closing-kicker">THANK YOU</p>
        <h1 class="t-display">감사합니다</h1>
        <p class="closing-sub">질문은 지금, 또는 아래 연락처로 언제든 환영합니다.</p>
      </div>

      <div class="contact-row">
        <div class="contact-item">
          <p class="contact-label">PRESENTER</p>
          <p class="contact-value">김민준 · 전략기획팀장</p>
        </div>
        <div class="contact-item">
          <p class="contact-label">EMAIL</p>
          <p class="contact-value">mj.kim@acme.co.kr</p>
        </div>
        <div class="contact-item">
          <p class="contact-label">TEL</p>
          <p class="contact-value">02-1234-5678</p>
        </div>
      </div>

    </div>
    <div class="closing-edge"></div>
  </div>
</body>
</html>
