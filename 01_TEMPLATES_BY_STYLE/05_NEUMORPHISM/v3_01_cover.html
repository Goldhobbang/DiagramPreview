<!-- @card V3 Night Soft · 표지 | 다크 뉴모 · 하단 계단식 스택 · 상단 55% 여백 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Neumorphism V3 · 표지</title>
  <!-- 자기완결형: CSS 전체를 아래에 인라인했다. 외부 링크 없음.
       토큰을 고치려면 이 파일을 직접 고친다 (표지·전역 2장을 함께). -->
  <style>
/* ===== 03_ASSETS/css/00_reset.css ===== */
/* ==========================================================================
   00_reset.css — 슬라이드 전용 최소 리셋
   normalize.css를 쓰지 않는 이유: 범용 규칙이 Figma 레이어에 노이즈를 더한다.
   로드 순서: 00_reset → 01_variables → 02_slide_base → 03_components → 테마 토큰
   ========================================================================== */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* rem을 쓰지 않지만, 브라우저 기본 확대 설정의 영향을 없애기 위해 고정 */
  font-size: 16px;
}

body {
  background: #52525b;              /* 캔버스 밖 회색 — 슬라이드 경계를 눈으로 구분 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

th {
  text-align: left;
  font-weight: inherit;
}

/* 슬라이드는 정적 캡처 대상 — 애니메이션은 최종 상태로 고정한다 */
*,
*::before,
*::after {
  animation: none !important;
  transition: none !important;
}
/* ===== 03_ASSETS/css/01_variables.css ===== */
/* ==========================================================================
   01_variables.css — 디자인 토큰 단일 소스
   규칙: 의미 기반 이름만 쓴다 (--blue-500 X / --color-accent O)
   테마 교체는 같은 변수명을 덮어쓰는 방식. 슬라이드는 .v1/.v2/.v3 클래스에 건다.
   상세: 00_GUIDES/02_DESIGN_SYSTEM.md
   ========================================================================== */

:root {
  /* --- 캔버스 --------------------------------------------------------- */
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-pad: 96px;               /* 세이프 영역 */
  --content-w: 1728px;             /* 1920 - 96*2 */
  --content-h: 888px;              /* 1080 - 96*2 */
  --grid-cols: 12;
  --grid-gutter: 32px;

  /* --- 폰트 ----------------------------------------------------------- */
  --font-sans: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  --font-serif: "Noto Serif KR", Georgia, serif;
  --font-kicker: var(--font-sans);  /* 라벨/킥커 전용 훅 — 대부분 본문과 동일, 럭셔리 계열만 세리프로 교체 */

  /* --- 타입 스케일 (1080p 프로젝터 기준 / 최소 18px) ------------------- */
  --fs-display: 96px;
  --fs-h1: 64px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-body-l: 28px;
  --fs-body-m: 24px;
  --fs-caption: 18px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* line-height만 배수 사용 — 폰트 교체에 강하다 */
  --lh-tight: 1.2;
  --lh-heading: 1.3;
  --lh-body: 1.6;

  --ls-tight: -0.02em;             /* 48px 이상 대제목 */
  --ls-normal: 0;
  --ls-wide: 0.05em;               /* 대문자 라벨 */

  /* --- 간격 (8px 배수) ------------------------------------------------ */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 48px;
  --sp-7: 64px;
  --sp-8: 96px;
  --sp-9: 128px;

  /* --- 색: 시맨틱 (테마마다 값이 바뀜) -------------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-surface-alt: #e4e4e7;
  --color-text: #18181b;
  --color-text-muted: #71717a;
  --color-text-invert: #ffffff;
  --color-accent: #2563eb;
  --color-accent-sub: #60a5fa;
  --color-border: #d4d4d8;

  /* --- 색: 데이터 시각화 팔레트 (반드시 1→6 순서대로 사용) ------------ */
  --color-data-1: #2563eb;
  --color-data-2: #0ea5e9;
  --color-data-3: #14b8a6;
  --color-data-4: #f59e0b;
  --color-data-5: #ef4444;
  --color-data-6: #8b5cf6;

  /* --- 색: 상태 (테마 무관 고정) -------------------------------------- */
  --color-positive: #16a34a;
  --color-negative: #dc2626;
  --color-neutral: #71717a;

  /* --- 색: 반전 슬라이드 (전면 이미지 등 어두운 배경 1장용) ------------ */
  --color-bg-inverse: #0f172a;
  --color-text-on-inverse: #ffffff;
  --color-text-on-inverse-muted: #cbd5e1;

  /* --- 카드 보더 (Minimal Mono처럼 선으로 구분하는 테마만 1px로 올림) -- */
  --card-border-w: 0px;

  /* --- 라운드 --------------------------------------------------------- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* --- 그림자 (Figma 유실 방지: 다중 그림자 금지, 1개만) -------------- */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);

  /* --- 선 ------------------------------------------------------------- */
  --border-w: 1px;
  --border-w-thick: 3px;
}
/* ===== 03_ASSETS/css/02_slide_base.css ===== */
/* ==========================================================================
   02_slide_base.css — 슬라이드 캔버스 + 그리드 + 타이포 기본
   ========================================================================== */

/* --- 슬라이드 캔버스 ------------------------------------------------- */
.slide {
  width: var(--slide-w);
  height: var(--slide-h);
  overflow: hidden;                /* ★ Figma와 동일하게 잘라 보여줘 오버플로우를 조기에 발견 */
  position: relative;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-l);
  line-height: var(--lh-body);
  margin: 0 auto;
}

/* 세이프 영역이 적용된 콘텐츠 래퍼 */
.slide-inner {
  position: absolute;
  inset: var(--slide-pad);
  width: var(--content-w);
  height: var(--content-h);
  display: flex;
  flex-direction: column;
}

/* --- 컴포넌트 캔버스 (다이어그램 등 슬라이드보다 작은 단위) ---------- */
.component {
  width: 1400px;
  height: 700px;
  overflow: hidden;
  position: relative;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-m);
  line-height: var(--lh-body);
  margin: 0 auto;
  padding: var(--sp-6);
}

/* --- 그리드 ---------------------------------------------------------- */
/* Figma에서 Auto Layout으로 변환되지 않으므로, 다이어그램 내부보다는
   슬라이드 최상위 레이아웃에만 쓴다. 내부는 .row / .col(flex)을 쓸 것. */
.grid-12 {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), 1fr);
  gap: var(--grid-gutter);
}

/* flex 기반 — 이쪽이 Figma Auto Layout으로 변환된다 (권장) */
.row {
  display: flex;
  flex-direction: row;
  gap: var(--grid-gutter);
}

.col {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.row > .flex-1 { flex: 1; }
.row > .flex-2 { flex: 2; }
.row > .flex-3 { flex: 3; }

/* --- 타이포 유틸 ----------------------------------------------------- */
.t-display {
  font-size: var(--fs-display);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
}

.t-h1 {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
}

.t-h2 {
  font-size: var(--fs-h2);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
}

.t-h3 {
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
}

.t-body-l { font-size: var(--fs-body-l); }
.t-body-m { font-size: var(--fs-body-m); }

.t-caption {
  font-size: var(--fs-caption);
  line-height: 1.5;
  color: var(--color-text-muted);
}

.t-muted  { color: var(--color-text-muted); }
.t-accent { color: var(--color-accent); }
.t-center { text-align: center; }
.t-right  { text-align: right; }

/* 숫자 세로 정렬 — KPI를 나란히 놓으면 폭이 제각각인 숫자가 들쭉날쭉해 보인다.
   1과 8의 폭을 같게 고정한다. 한글 폰트는 대개 이 기능을 지원한다. */
.t-nums {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* --- 디버그 모드 ----------------------------------------------------- */
/* <body class="debug"> 로 켠다. 모든 박스 경계를 표시해 오버플로우를 잡는다. */
.debug .slide,
.debug .component {
  outline: 2px solid rgba(255, 0, 0, 0.6);
}

.debug .slide *,
.debug .component * {
  outline: 1px solid rgba(255, 0, 0, 0.25);
}

/* 세이프 영역 시각화 */
.debug .slide::after {
  content: "";
  position: absolute;
  inset: var(--slide-pad);
  outline: 1px dashed rgba(0, 128, 255, 0.8);
  pointer-events: none;
}
/* ===== 03_ASSETS/css/03_components.css ===== */
/* ==========================================================================
   03_components.css — 여러 다이어그램/슬라이드가 공유하는 최소 컴포넌트
   여기 있는 것만으로 다이어그램이 완성되지는 않는다. 반복되는 것만 올린다.
   ========================================================================== */

/* --- 카드 ------------------------------------------------------------ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-outlined {
  background: var(--color-bg);
  border: var(--border-w) solid var(--color-border);
}

.card-elevated {
  background: var(--color-bg);
  box-shadow: var(--shadow-sm);
}

/* --- 번호 배지 (프로세스 단계용) ------------------------------------- */
.step-num {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  color: var(--color-text-invert);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* --- 태그 / 배지 ----------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--color-surface-alt);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
}

.badge-accent {
  background: var(--color-accent);
  color: var(--color-text-invert);
}

/* --- 구분선 ---------------------------------------------------------- */
.divider {
  height: var(--border-w);
  background: var(--color-border);
  border: none;
}

.divider-accent {
  height: var(--border-w-thick);
  width: 96px;
  background: var(--color-accent);
}

/* --- 라벨 붙은 값 (KPI) ---------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.stat-value {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  color: var(--color-accent);
}

.stat-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  letter-spacing: var(--ls-wide);
}

/* --- 데이터 계열 색 (1~6 순서대로 사용) ------------------------------ */
.d1 { --c: var(--color-data-1); }
.d2 { --c: var(--color-data-2); }
.d3 { --c: var(--color-data-3); }
.d4 { --c: var(--color-data-4); }
.d5 { --c: var(--color-data-5); }
.d6 { --c: var(--color-data-6); }

.fill-data   { background: var(--c, var(--color-data-1)); }
.text-data   { color: var(--c, var(--color-data-1)); }
.border-data { border-color: var(--c, var(--color-data-1)); }

/* --- 정렬 유틸 ------------------------------------------------------- */
.items-center   { align-items: center; }
.items-start    { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grow           { flex: 1; }
/* ===== 베리에이션 토큰 (.v1 / .v2 / .v3) ===== */
/* ==========================================================================
   05_NEUMORPHISM — 배경과 같은 색의 표면이 밀려 나오거나 눌려 들어간다.
   기획: 00_GUIDES/PLANS/05_NEUMORPHISM.md

   광원은 항상 좌상단 135° 고정. 그림자는 밝은 쪽(좌상) + 어두운 쪽(우하) 2개 1세트.
   요소와 배경은 반드시 같은 색이어야 한다 — 다르면 그냥 카드다.
   3종 구조: V1 중앙 집중 / V2 좌측 비대칭 / V3 하단 스택.
   ========================================================================== */

/* 공통: 뉴모는 보더를 쓰지 않는다. 형태는 그림자로만 만든다. */
.v1, .v2, .v3 {
  --card-border-w: 0px;
  --color-border: transparent;
}

/* --- V1 Soft Gray — 클래식 소프트 UI --------------------------------- */
.v1 {
  --color-bg: #e0e5ec;
  --color-surface: #e0e5ec;         /* 배경과 동일 — 이것이 뉴모의 전제 */
  --color-surface-alt: #e0e5ec;
  --color-text: #3e4a5b;
  --color-text-muted: #8494a8;
  --color-text-invert: #ffffff;
  --color-accent: #5b7fff;
  --color-accent-sub: #3e5fd9;

  --nm-light: #ffffff;
  --nm-dark: #a3b1c6;
  --nm-out: -8px -8px 16px var(--nm-light), 8px 8px 16px var(--nm-dark);
  --nm-in: inset -6px -6px 12px var(--nm-light), inset 6px 6px 12px var(--nm-dark);

  --radius-sm: 16px;
  --radius-md: 24px;
  --radius-lg: 32px;
}

/* --- V2 Warm Clay — 유기적 형태, 더 물렁한 촉감 ---------------------- */
.v2 {
  --color-bg: #ede4da;
  --color-surface: #ede4da;
  --color-surface-alt: #ede4da;
  --color-text: #4a3b2f;
  --color-text-muted: #9a8574;
  --color-text-invert: #ffffff;
  --color-accent: #c96f4a;
  --color-accent-sub: #a85835;

  --nm-light: #fffaf4;
  --nm-dark: #c4b3a2;
  /* blur를 V1보다 크게 — 촉감이 물렁해진다 */
  --nm-out: -10px -10px 24px var(--nm-light), 10px 10px 24px var(--nm-dark);
  --nm-in: inset -8px -8px 18px var(--nm-light), inset 8px 8px 18px var(--nm-dark);

  --radius-sm: 20px;
  --radius-md: 24px;
  --radius-lg: 60px;
}

/* --- V3 Night Soft — 다크 뉴모 --------------------------------------- */
.v3 {
  --color-bg: #2e3239;
  --color-surface: #2e3239;
  --color-surface-alt: #2e3239;
  --color-text: #e4e7ec;            /* 순백 금지 */
  --color-text-muted: #8a919c;
  --color-text-invert: #2e3239;
  --color-accent: #4fd1a5;
  --color-accent-sub: #2fa984;

  --nm-light: #3a3f48;
  --nm-dark: #1e2127;
  /* 다크는 밝은 쪽 대비가 약하다. blur를 줄이고 오프셋을 키워 형태를 지킨다. */
  --nm-out: -10px -10px 14px var(--nm-light), 10px 10px 14px var(--nm-dark);
  --nm-in: inset -10px -10px 14px var(--nm-light), inset 10px 10px 14px var(--nm-dark);

  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
}
  </style>
  <style>
    /* 상단 55%를 비우고 하단에만 스택을 쌓는다.
       여백과 스택의 대비가 이 표지의 전부다. */
    .stack { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; }
    .plate {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      box-shadow: var(--nm-out);
    }
    .plate.back { width: 92%; height: 220px; bottom: 172px; }
    .plate.mid  { width: 84%; height: 200px; bottom: 116px; }
    .plate.front {
      width: 76%;
      height: 180px;
      bottom: 60px;
      display: flex;
      align-items: center;
      padding: 0 var(--sp-7);
      gap: var(--sp-6);
    }

    /* 앞 패널 안 함몰 트랙 + 민트 필 */
    .track { flex: 1; height: 16px; border-radius: var(--radius-full); box-shadow: var(--nm-in); padding: 3px; }
    .fill {
      width: 40%;
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--color-accent);
      box-shadow: 0 0 16px rgba(79, 209, 165, 0.35);
    }
    .track-label { font-size: var(--fs-body-m); color: var(--color-text-muted); }

    /* 제목은 비어 있는 상단 영역 좌하단 */
    .title-block {
      position: absolute;
      left: var(--slide-pad);
      top: 42%;
      transform: translateY(-100%);
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }
    .cover-title { font-weight: var(--fw-regular); }
    .kicker {
      font-size: var(--fs-caption);
      letter-spacing: var(--ls-wide);
      color: var(--color-text-muted);
    }

    /* 우상단 돌출 원 */
    .knob {
      position: absolute;
      right: var(--slide-pad);
      top: 120px;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: var(--color-surface);
      box-shadow: var(--nm-out);
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="slide v3">

    <div class="knob">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none"
           stroke="var(--color-accent)" stroke-width="2">
        <path d="M10 32l10-12 8 8 10-16"/>
      </svg>
    </div>

    <div class="title-block">
      <p class="kicker">BRAND CAMPAIGN 2026</p>
      <h1 class="t-display cover-title">우리가 만드는<br>다음 이야기</h1>
    </div>
