<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Brutalism V5 · 표지</title>
  <!-- 자기완결형: CSS 전체를 아래에 인라인했다. 외부 링크 없음.
       토큰을 고치려면 이 파일을 직접 고친다 (표지·전역 2장을 함께). -->
  <style>
/* ===== 03_ASSETS/css/00_reset.css ===== */
/* ==========================================================================
   00_reset.css — 슬라이드 전용 최소 리셋
   normalize.css를 쓰지 않는 이유: 범용 규칙이 Figma 레이어에 노이즈를 더한다.
   로드 순서: 00_reset → 01_variables → 02_slide_base → 03_components → 테마 토큰
   ========================================================================== */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* rem을 쓰지 않지만, 브라우저 기본 확대 설정의 영향을 없애기 위해 고정 */
  font-size: 16px;
}

body {
  background: #52525b;              /* 캔버스 밖 회색 — 슬라이드 경계를 눈으로 구분 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

th {
  text-align: left;
  font-weight: inherit;
}

/* 슬라이드는 정적 캡처 대상 — 애니메이션은 최종 상태로 고정한다 */
*,
*::before,
*::after {
  animation: none !important;
  transition: none !important;
}
/* ===== 03_ASSETS/css/01_variables.css ===== */
/* ==========================================================================
   01_variables.css — 디자인 토큰 단일 소스
   규칙: 의미 기반 이름만 쓴다 (--blue-500 X / --color-accent O)
   테마 교체는 같은 변수명을 덮어쓰는 방식. 슬라이드는 .v1/.v2/.v3 클래스에 건다.
   상세: 00_GUIDES/02_DESIGN_SYSTEM.md
   ========================================================================== */

:root {
  /* --- 캔버스 --------------------------------------------------------- */
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-pad: 96px;               /* 세이프 영역 */
  --content-w: 1728px;             /* 1920 - 96*2 */
  --content-h: 888px;              /* 1080 - 96*2 */
  --grid-cols: 12;
  --grid-gutter: 32px;

  /* --- 폰트 ----------------------------------------------------------- */
  --font-sans: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  --font-serif: "Noto Serif KR", Georgia, serif;
  --font-kicker: var(--font-sans);  /* 라벨/킥커 전용 훅 — 대부분 본문과 동일, 럭셔리 계열만 세리프로 교체 */

  /* --- 타입 스케일 (1080p 프로젝터 기준 / 최소 18px) ------------------- */
  --fs-display: 96px;
  --fs-h1: 64px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-body-l: 28px;
  --fs-body-m: 24px;
  --fs-caption: 18px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* line-height만 배수 사용 — 폰트 교체에 강하다 */
  --lh-tight: 1.2;
  --lh-heading: 1.3;
  --lh-body: 1.6;

  --ls-tight: -0.02em;             /* 48px 이상 대제목 */
  --ls-normal: 0;
  --ls-wide: 0.05em;               /* 대문자 라벨 */

  /* --- 간격 (8px 배수) ------------------------------------------------ */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 48px;
  --sp-7: 64px;
  --sp-8: 96px;
  --sp-9: 128px;

  /* --- 색: 시맨틱 (테마마다 값이 바뀜) -------------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-surface-alt: #e4e4e7;
  --color-text: #18181b;
  --color-text-muted: #71717a;
  --color-text-invert: #ffffff;
  --color-accent: #2563eb;
  --color-accent-sub: #60a5fa;
  --color-border: #d4d4d8;

  /* --- 색: 데이터 시각화 팔레트 (반드시 1→6 순서대로 사용) ------------ */
  --color-data-1: #2563eb;
  --color-data-2: #0ea5e9;
  --color-data-3: #14b8a6;
  --color-data-4: #f59e0b;
  --color-data-5: #ef4444;
  --color-data-6: #8b5cf6;

  /* --- 색: 상태 (테마 무관 고정) -------------------------------------- */
  --color-positive: #16a34a;
  --color-negative: #dc2626;
  --color-neutral: #71717a;

  /* --- 색: 반전 슬라이드 (전면 이미지 등 어두운 배경 1장용) ------------ */
  --color-bg-inverse: #0f172a;
  --color-text-on-inverse: #ffffff;
  --color-text-on-inverse-muted: #cbd5e1;

  /* --- 카드 보더 (Minimal Mono처럼 선으로 구분하는 테마만 1px로 올림) -- */
  --card-border-w: 0px;

  /* --- 라운드 --------------------------------------------------------- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* --- 그림자 (Figma 유실 방지: 다중 그림자 금지, 1개만) -------------- */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);

  /* --- 선 ------------------------------------------------------------- */
  --border-w: 1px;
  --border-w-thick: 3px;
}
/* ===== 03_ASSETS/css/02_slide_base.css ===== */
/* ==========================================================================
   02_slide_base.css — 슬라이드 캔버스 + 그리드 + 타이포 기본
   ========================================================================== */

/* --- 슬라이드 캔버스 ------------------------------------------------- */
.slide {
  width: var(--slide-w);
  height: var(--slide-h);
  overflow: hidden;                /* ★ Figma와 동일하게 잘라 보여줘 오버플로우를 조기에 발견 */
  position: relative;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-l);
  line-height: var(--lh-body);
  margin: 0 auto;
}

/* 세이프 영역이 적용된 콘텐츠 래퍼 */
.slide-inner {
  position: absolute;
  inset: var(--slide-pad);
  width: var(--content-w);
  height: var(--content-h);
  display: flex;
  flex-direction: column;
}

/* --- 컴포넌트 캔버스 (다이어그램 등 슬라이드보다 작은 단위) ---------- */
.component {
  width: 1400px;
  height: 700px;
  overflow: hidden;
  position: relative;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-m);
  line-height: var(--lh-body);
  margin: 0 auto;
  padding: var(--sp-6);
}

/* --- 그리드 ---------------------------------------------------------- */
/* Figma에서 Auto Layout으로 변환되지 않으므로, 다이어그램 내부보다는
   슬라이드 최상위 레이아웃에만 쓴다. 내부는 .row / .col(flex)을 쓸 것. */
.grid-12 {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), 1fr);
  gap: var(--grid-gutter);
}

/* flex 기반 — 이쪽이 Figma Auto Layout으로 변환된다 (권장) */
.row {
  display: flex;
  flex-direction: row;
  gap: var(--grid-gutter);
}

.col {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.row > .flex-1 { flex: 1; }
.row > .flex-2 { flex: 2; }
.row > .flex-3 { flex: 3; }

/* --- 타이포 유틸 ----------------------------------------------------- */
.t-display {
  font-size: var(--fs-display);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
}

.t-h1 {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
}

.t-h2 {
  font-size: var(--fs-h2);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
}

.t-h3 {
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
}

.t-body-l { font-size: var(--fs-body-l); }
.t-body-m { font-size: var(--fs-body-m); }

.t-caption {
  font-size: var(--fs-caption);
  line-height: 1.5;
  color: var(--color-text-muted);
}

.t-muted  { color: var(--color-text-muted); }
.t-accent { color: var(--color-accent); }
.t-center { text-align: center; }
.t-right  { text-align: right; }

/* 숫자 세로 정렬 — KPI를 나란히 놓으면 폭이 제각각인 숫자가 들쭉날쭉해 보인다.
   1과 8의 폭을 같게 고정한다. 한글 폰트는 대개 이 기능을 지원한다. */
.t-nums {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* --- 디버그 모드 ----------------------------------------------------- */
/* <body class="debug"> 로 켠다. 모든 박스 경계를 표시해 오버플로우를 잡는다. */
.debug .slide,
.debug .component {
  outline: 2px solid rgba(255, 0, 0, 0.6);
}

.debug .slide *,
.debug .component * {
  outline: 1px solid rgba(255, 0, 0, 0.25);
}

/* 세이프 영역 시각화 */
.debug .slide::after {
  content: "";
  position: absolute;
  inset: var(--slide-pad);
  outline: 1px dashed rgba(0, 128, 255, 0.8);
  pointer-events: none;
}
/* ===== 03_ASSETS/css/03_components.css ===== */
/* ==========================================================================
   03_components.css — 여러 다이어그램/슬라이드가 공유하는 최소 컴포넌트
   여기 있는 것만으로 다이어그램이 완성되지는 않는다. 반복되는 것만 올린다.
   ========================================================================== */

/* --- 카드 ------------------------------------------------------------ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-outlined {
  background: var(--color-bg);
  border: var(--border-w) solid var(--color-border);
}

.card-elevated {
  background: var(--color-bg);
  box-shadow: var(--shadow-sm);
}

/* --- 번호 배지 (프로세스 단계용) ------------------------------------- */
.step-num {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  color: var(--color-text-invert);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* --- 태그 / 배지 ----------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--color-surface-alt);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
}

.badge-accent {
  background: var(--color-accent);
  color: var(--color-text-invert);
}

/* --- 구분선 ---------------------------------------------------------- */
.divider {
  height: var(--border-w);
  background: var(--color-border);
  border: none;
}

.divider-accent {
  height: var(--border-w-thick);
  width: 96px;
  background: var(--color-accent);
}

/* --- 라벨 붙은 값 (KPI) ---------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.stat-value {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  color: var(--color-accent);
}

.stat-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  letter-spacing: var(--ls-wide);
}

/* --- 데이터 계열 색 (1~6 순서대로 사용) ------------------------------ */
.d1 { --c: var(--color-data-1); }
.d2 { --c: var(--color-data-2); }
.d3 { --c: var(--color-data-3); }
.d4 { --c: var(--color-data-4); }
.d5 { --c: var(--color-data-5); }
.d6 { --c: var(--color-data-6); }

.fill-data   { background: var(--c, var(--color-data-1)); }
.text-data   { color: var(--c, var(--color-data-1)); }
.border-data { border-color: var(--c, var(--color-data-1)); }

/* --- 정렬 유틸 ------------------------------------------------------- */
.items-center   { align-items: center; }
.items-start    { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grow           { flex: 1; }
/* ===== 베리에이션 토큰 (.v4 / .v5 / .v6) ===== */
/* ==========================================================================
   09_BRUTALISM — 꾸미지 않은 날것. 시스템 서체, 노출된 구조.
   기획: 00_GUIDES/PLANS/09_BRUTALISM.md

   11번 네오 브루탈리즘과 다르다: 여기는 그림자·라운드가 전혀 없다.
   낡고 거칠고 불친절한 쪽.
   3종 구조: V4 신문 1면(웜 라이트, 세로 단 분할) / V5 구형 OS 창(쿨 틸, 창+작업표시줄)
            / V6 현장 안전 표지(웜 다크, 가로 띠 분할).
   ========================================================================== */

/* 공통: 라운드 0, 그림자 0. 서체는 시스템 기본만. */
.v4, .v5, .v6 {
  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;
  --radius-full: 0px;
  --shadow-sm: none;
  --shadow-md: none;
  --card-border-w: 0px;
  --border-w: 2px;
  --border-w-thick: 4px;
  --font-mono: "Courier New", Courier, monospace;
}

/* --- V4 Newsprint — 누렇게 바랜 신문지, 세로 단 분할 ---------------- */
.v4 {
  --color-bg: #e9e1cc;
  --color-surface: #f3eedf;
  --color-surface-alt: #d9cfb4;
  --color-text: #141210;
  --color-text-muted: #3f392f;
  --color-text-invert: #ffffff;
  --color-accent: #1038c8;          /* 청색 별색 인쇄 — 슬라이드당 1회 */
  --color-accent-sub: #141210;
  --color-border: #141210;

  --font-sans: "Times New Roman", Times, serif;
}

/* --- V5 System Window — 구형 OS 기본 창, 틸 바탕화면 ---------------- */
.v5 {
  --color-bg: #008080;
  --color-surface: #c0c0c0;
  --color-surface-alt: #dfdfdf;
  --color-text: #000000;
  --color-text-muted: #404040;
  --color-text-invert: #ffffff;
  --color-accent: #000080;          /* 제목 표시줄 — 슬라이드당 1회 */
  --color-accent-sub: #000000;
  --color-border: #000000;

  --font-sans: Arial, Helvetica, sans-serif;
  --v-hi: #ffffff;                  /* 베벨 밝은 변 */
  --v-lo: #808080;                  /* 베벨 어두운 변 */
  --v-field: #ffffff;               /* 입력 칸·목록 바탕 */
}

/* --- V6 Hazard Stencil — 아스팔트 바탕 안전 표지, 가로 띠 분할 ------ */
.v6 {
  --color-bg: #181613;
  --color-surface: #24211c;
  --color-surface-alt: #2f2b24;
  --color-text: #f1ece0;
  --color-text-muted: #b8b09f;
  --color-text-invert: #181613;
  --color-accent: #f2b705;          /* 경고 표지 황색 — 면으로 1곳 */
  --color-accent-sub: #f1ece0;
  --color-border: #f1ece0;

  --font-sans: Arial, Helvetica, sans-serif;
}

    .icon-label { color: var(--color-text-invert); font-size: 20px; font-weight: 700; text-align: center; line-height: 1.4; }
    .icon.is-selected .icon-label { background: var(--color-accent); padding: 0 var(--sp-1); }

    .main-win { flex: 1; }
    .win-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: var(--sp-6); }
    .cover-title { font-size: 128px; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; }
    .cover-sub { margin-top: var(--sp-3); font-size: 32px; line-height: 1.5; }

    .setup { display: flex; flex-direction: column; gap: var(--sp-3); }
    .setup-label { font-size: 24px; font-weight: 700; }
    .gauge { display: flex; gap: var(--sp-1); padding: var(--sp-1); }
    .seg { flex: 1; height: 32px; }
    .seg.on { background: var(--color-accent); }
    .btn-row { display: flex; gap: var(--sp-3); justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="slide v5">
    <div class="slide-inner desk">

      <div class="desktop">
        <div class="icons">
          <div class="icon">
            <svg width="64" height="64" viewBox="0 0 64 64"><rect x="4" y="16" width="56" height="40" fill="var(--color-surface)" stroke="var(--color-text)" stroke-width="4"/><rect x="4" y="8" width="24" height="12" fill="var(--color-surface)" stroke="var(--color-text)" stroke-width="4"/></svg>
            <p class="icon-label">내 문서</p>
          </div>
          <div class="icon">
            <svg width="64" height="64" viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="36" fill="var(--v-field)" stroke="var(--color-text)" stroke-width="4"/><rect x="24" y="48" width="16" height="8" fill="var(--color-text)"/><rect x="16" y="56" width="32" height="4" fill="var(--color-text)"/></svg>
            <p class="icon-label">내 컴퓨터</p>
          </div>
          <div class="icon is-selected">
            <svg width="64" height="64" viewBox="0 0 64 64"><rect x="12" y="4" width="40" height="56" fill="var(--v-field)" stroke="var(--color-text)" stroke-width="4"/><rect x="20" y="16" width="24" height="4" fill="var(--color-text)"/><rect x="20" y="28" width="24" height="4" fill="var(--color-text)"/><rect x="20" y="40" width="16" height="4" fill="var(--color-text)"/></svg>
            <p class="icon-label">구축계획.doc</p>
          </div>
          <div class="icon">
            <svg width="64" height="64" viewBox="0 0 64 64"><rect x="8" y="12" width="48" height="44" fill="var(--color-surface)" stroke="var(--color-text)" stroke-width="4"/><rect x="16" y="20" width="32" height="8" fill="var(--color-text)"/></svg>
            <p class="icon-label">휴지통</p>
          </div>
        </div>

        <div class="win main-win">
          <div class="titlebar">
            <span>구축계획.exe — 고객지원센터</span>
            <div class="winbtns"><span class="winbtn">_</span><span class="winbtn">□</span><span class="winbtn">X</span></div>
          </div>
          <div class="menubar"><span>파일(F)</span><span>편집(E)</span><span>보기(V)</span><span>도움말(H)</span></div>

          <div class="win-body">
            <div>
              <h1 class="cover-title">고객지원센터<br>새로 짓습니다</h1>
              <p class="cover-sub">청명상사 경영지원본부 · 2027년 1월 개소 계획</p>
            </div>
            <div class="setup">
              <p class="setup-label">설치 진행률 · 준비 단계 3 / 8</p>
              <div class="inset gauge">
                <span class="seg on"></span><span class="seg on"></span><span class="seg on"></span><span class="seg"></span>
                <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
              </div>
              <div class="btn-row"><span class="btn">다음(N) &gt;</span><span class="btn">취소</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="taskbar">
        <span class="btn">시작</span>
        <span class="btn task-open">구축계획.exe — 고객지원센터</span>
        <span class="inset clock">2026-11-16 09:30</span>
      </div>

    </div>
  </div>
</body>
</html>
