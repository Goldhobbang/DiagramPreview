<!-- @card 인용 | 인용문 / 핵심 메시지 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>인용</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    /* 배경 고스트 인용부호 — 폰트 글리프 사용 (Figma에서 텍스트 레이어 유지) */
    .ghost-quote {
      position: absolute;
      left: 64px;
      top: -96px;
      font-size: 640px;
      font-weight: var(--fw-bold);
      line-height: 1;
      font-family: var(--font-serif);
      color: var(--color-accent);
      opacity: 0.08;
    }

    .quote-inner {
      justify-content: center;
      gap: var(--sp-7);
      padding-left: 192px;             /* 인용부호 아래에서 본문 시작 — 비대칭 구도 */
    }
    .quote-text {
      font-size: var(--fs-h1);
      font-weight: var(--fw-semibold);
      line-height: 1.4;
      letter-spacing: var(--ls-tight);
      max-width: 1300px;
    }
    .quote-text strong { color: var(--color-accent); font-weight: var(--fw-bold); }

    .quote-attr {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
    }
    .attr-rule {
      width: 64px;
      height: var(--border-w-thick);
      background: var(--color-accent);
    }
    .quote-name {
      font-size: var(--fs-body-l);
      font-weight: var(--fw-semibold);
    }
    .quote-role {
      font-size: var(--fs-body-m);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <div class="slide">
    <p class="ghost-quote">“</p>
    <div class="slide-inner quote-inner">

      <p class="quote-text">
        고객은 기능이 부족해서 떠나지 않는다.<br>
        <strong>성공하는 방법을 몰라서</strong> 떠난다.
      </p>

      <div class="quote-attr">
        <div class="attr-rule"></div>
        <p class="quote-name">이지원</p>
        <p class="quote-role">기술본부장 · 2026 상반기 고객 경험 리뷰</p>
      </div>

    </div>
  </div>
</body>
</html>
