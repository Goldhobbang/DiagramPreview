<!-- @card 마무리 | Q&A / 연락처 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마무리</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    .closing-edge {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1920px;
      height: 24px;
      background: var(--color-accent);
    }
    .closing-inner { justify-content: center; gap: var(--sp-7); }
    .closing-main { display: flex; flex-direction: column; gap: var(--sp-4); }
    .closing-sub {
      font-size: var(--fs-h3);
      font-weight: var(--fw-regular);
      color: var(--color-text-muted);
      line-height: 1.5;
    }
    .contact-row { display: flex; gap: var(--sp-7); }
    .contact-item {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .contact-text {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-medium);
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-inner closing-inner">

      <div class="closing-main">
        <h1 class="t-display">감사합니다</h1>
        <p class="closing-sub">질문은 지금, 또는 아래 연락처로 언제든 환영합니다.</p>
      </div>

      <div class="contact-row">
        <div class="contact-item">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" fill="var(--color-accent)" fill-opacity="0.12"/>
            <circle cx="20" cy="16" r="5" stroke="var(--color-accent)" stroke-width="3"/>
            <path d="M11 29 C11 24 15 21 20 21 C25 21 29 24 29 29" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <p class="contact-text">전략기획팀 김민준 팀장</p>
        </div>
        <div class="contact-item">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" fill="var(--color-accent)" fill-opacity="0.12"/>
            <rect x="10" y="13" width="20" height="14" rx="3" stroke="var(--color-accent)" stroke-width="3"/>
            <path d="M10 15 L20 22 L30 15" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="contact-text">mj.kim@acme.co.kr</p>
        </div>
        <div class="contact-item">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" fill="var(--color-accent)" fill-opacity="0.12"/>
            <path d="M14 11 C13 11 12 12 12 13 C12 21 19 28 27 28 C28 28 29 27 29 26 L29 23 L24 21 L22 23 C19.5 22 18 20.5 17 18 L19 16 L17 11 Z" stroke="var(--color-accent)" stroke-width="3" stroke-linejoin="round"/>
          </svg>
          <p class="contact-text">02-1234-5678</p>
        </div>
      </div>

      <p class="t-caption">ACME CORPORATION · 2026 하반기 전략 보고</p>

    </div>
    <div class="closing-edge"></div>
  </div>
</body>
</html>
