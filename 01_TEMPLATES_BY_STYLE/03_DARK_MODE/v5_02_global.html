<!-- @card V5 Rose Wine · 전역 | 헤더 탭 + KPI 4칸 스트립 + 사유 순위 막대 + 시사점 콜아웃 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Dark Mode V5 · 전역</title>
  <!-- 자기완결형: CSS 전체를 아래에 인라인했다. 외부 링크 없음.
       토큰을 고치려면 이 파일을 직접 고친다 (표지·전역 2장을 함께). -->
  <style>
/* ===== 03_ASSETS/css/00_reset.css ===== */
/* ==========================================================================
   00_reset.css — 슬라이드 전용 최소 리셋
   normalize.css를 쓰지 않는 이유: 범용 규칙이 Figma 레이어에 노이즈를 더한다.
   로드 순서: 00_reset → 01_variables → 02_slide_base → 03_components → 테마 토큰
   ========================================================================== */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* rem을 쓰지 않지만, 브라우저 기본 확대 설정의 영향을 없애기 위해 고정 */
  font-size: 16px;
}

body {
  background: #52525b;              /* 캔버스 밖 회색 — 슬라이드 경계를 눈으로 구분 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

th {
  text-align: left;
  font-weight: inherit;
}

/* 슬라이드는 정적 캡처 대상 — 애니메이션은 최종 상태로 고정한다 */
*,
*::before,
*::after {
  animation: none !important;
  transition: none !important;
}
/* ===== 03_ASSETS/css/01_variables.css ===== */
/* ==========================================================================
   01_variables.css — 디자인 토큰 단일 소스
   규칙: 의미 기반 이름만 쓴다 (--blue-500 X / --color-accent O)
   테마 교체는 같은 변수명을 덮어쓰는 방식. 슬라이드는 .v1/.v2/.v3 클래스에 건다.
   상세: 00_GUIDES/02_DESIGN_SYSTEM.md
   ========================================================================== */

:root {
  /* --- 캔버스 --------------------------------------------------------- */
  --slide-w: 1920px;
  --slide-h: 1080px;
  --slide-pad: 96px;               /* 세이프 영역 */
  --content-w: 1728px;             /* 1920 - 96*2 */
  --content-h: 888px;              /* 1080 - 96*2 */
  --grid-cols: 12;
  --grid-gutter: 32px;

  /* --- 폰트 ----------------------------------------------------------- */
  --font-sans: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  --font-serif: "Noto Serif KR", Georgia, serif;
  --font-kicker: var(--font-sans);  /* 라벨/킥커 전용 훅 — 대부분 본문과 동일, 럭셔리 계열만 세리프로 교체 */

  /* --- 타입 스케일 (1080p 프로젝터 기준 / 최소 18px) ------------------- */
  --fs-display: 96px;
  --fs-h1: 64px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-body-l: 28px;
  --fs-body-m: 24px;
  --fs-caption: 18px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* line-height만 배수 사용 — 폰트 교체에 강하다 */
  --lh-tight: 1.2;
  --lh-heading: 1.3;
  --lh-body: 1.6;

  --ls-tight: -0.02em;             /* 48px 이상 대제목 */
  --ls-normal: 0;
  --ls-wide: 0.05em;               /* 대문자 라벨 */

  /* --- 간격 (8px 배수) ------------------------------------------------ */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 16px;
  --sp-4: 24px;
  --sp-5: 32px;
  --sp-6: 48px;
  --sp-7: 64px;
  --sp-8: 96px;
  --sp-9: 128px;

  /* --- 색: 시맨틱 (테마마다 값이 바뀜) -------------------------------- */
  --color-bg: #ffffff;
  --color-surface: #f4f4f5;
  --color-surface-alt: #e4e4e7;
  --color-text: #18181b;
  --color-text-muted: #71717a;
  --color-text-invert: #ffffff;
  --color-accent: #2563eb;
  --color-accent-sub: #60a5fa;
  --color-border: #d4d4d8;

  /* --- 색: 데이터 시각화 팔레트 (반드시 1→6 순서대로 사용) ------------ */
  --color-data-1: #2563eb;
  --color-data-2: #0ea5e9;
  --color-data-3: #14b8a6;
  --color-data-4: #f59e0b;
  --color-data-5: #ef4444;
  --color-data-6: #8b5cf6;

  /* --- 색: 상태 (테마 무관 고정) -------------------------------------- */
  --color-positive: #16a34a;
  --color-negative: #dc2626;
  --color-neutral: #71717a;

  /* --- 색: 반전 슬라이드 (전면 이미지 등 어두운 배경 1장용) ------------ */
  --color-bg-inverse: #0f172a;
  --color-text-on-inverse: #ffffff;
  --color-text-on-inverse-muted: #cbd5e1;

  /* --- 카드 보더 (Minimal Mono처럼 선으로 구분하는 테마만 1px로 올림) -- */
  --card-border-w: 0px;

  /* --- 라운드 --------------------------------------------------------- */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* --- 그림자 (Figma 유실 방지: 다중 그림자 금지, 1개만) -------------- */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);

  /* --- 선 ------------------------------------------------------------- */
  --border-w: 1px;
  --border-w-thick: 3px;
}
/* ===== 03_ASSETS/css/02_slide_base.css ===== */
/* ==========================================================================
   02_slide_base.css — 슬라이드 캔버스 + 그리드 + 타이포 기본
   ========================================================================== */

/* --- 슬라이드 캔버스 ------------------------------------------------- */
.slide {
  width: var(--slide-w);
  height: var(--slide-h);
  overflow: hidden;                /* ★ Figma와 동일하게 잘라 보여줘 오버플로우를 조기에 발견 */
  position: relative;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-l);
  line-height: var(--lh-body);
  margin: 0 auto;
}

/* 세이프 영역이 적용된 콘텐츠 래퍼 */
.slide-inner {
  position: absolute;
  inset: var(--slide-pad);
  width: var(--content-w);
  height: var(--content-h);
  display: flex;
  flex-direction: column;
}

/* --- 컴포넌트 캔버스 (다이어그램 등 슬라이드보다 작은 단위) ---------- */
.component {
  width: 1400px;
  height: 700px;
  overflow: hidden;
  position: relative;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body-m);
  line-height: var(--lh-body);
  margin: 0 auto;
  padding: var(--sp-6);
}

/* --- 그리드 ---------------------------------------------------------- */
/* Figma에서 Auto Layout으로 변환되지 않으므로, 다이어그램 내부보다는
   슬라이드 최상위 레이아웃에만 쓴다. 내부는 .row / .col(flex)을 쓸 것. */
.grid-12 {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), 1fr);
  gap: var(--grid-gutter);
}

/* flex 기반 — 이쪽이 Figma Auto Layout으로 변환된다 (권장) */
.row {
  display: flex;
  flex-direction: row;
  gap: var(--grid-gutter);
}

.col {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.row > .flex-1 { flex: 1; }
.row > .flex-2 { flex: 2; }
.row > .flex-3 { flex: 3; }

/* --- 타이포 유틸 ----------------------------------------------------- */
.t-display {
  font-size: var(--fs-display);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
}

.t-h1 {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
}

.t-h2 {
  font-size: var(--fs-h2);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
}

.t-h3 {
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
}

.t-body-l { font-size: var(--fs-body-l); }
.t-body-m { font-size: var(--fs-body-m); }

.t-caption {
  font-size: var(--fs-caption);
  line-height: 1.5;
  color: var(--color-text-muted);
}

.t-muted  { color: var(--color-text-muted); }
.t-accent { color: var(--color-accent); }
.t-center { text-align: center; }
.t-right  { text-align: right; }

/* 숫자 세로 정렬 — KPI를 나란히 놓으면 폭이 제각각인 숫자가 들쭉날쭉해 보인다.
   1과 8의 폭을 같게 고정한다. 한글 폰트는 대개 이 기능을 지원한다. */
.t-nums {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* --- 디버그 모드 ----------------------------------------------------- */
/* <body class="debug"> 로 켠다. 모든 박스 경계를 표시해 오버플로우를 잡는다. */
.debug .slide,
.debug .component {
  outline: 2px solid rgba(255, 0, 0, 0.6);
}

.debug .slide *,
.debug .component * {
  outline: 1px solid rgba(255, 0, 0, 0.25);
}

/* 세이프 영역 시각화 */
.debug .slide::after {
  content: "";
  position: absolute;
  inset: var(--slide-pad);
  outline: 1px dashed rgba(0, 128, 255, 0.8);
  pointer-events: none;
}
/* ===== 03_ASSETS/css/03_components.css ===== */
/* ==========================================================================
   03_components.css — 여러 다이어그램/슬라이드가 공유하는 최소 컴포넌트
   여기 있는 것만으로 다이어그램이 완성되지는 않는다. 반복되는 것만 올린다.
   ========================================================================== */

/* --- 카드 ------------------------------------------------------------ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-outlined {
  background: var(--color-bg);
  border: var(--border-w) solid var(--color-border);
}

.card-elevated {
  background: var(--color-bg);
  box-shadow: var(--shadow-sm);
}

/* --- 번호 배지 (프로세스 단계용) ------------------------------------- */
.step-num {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--color-accent);
  color: var(--color-text-invert);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* --- 태그 / 배지 ----------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--color-surface-alt);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
}

.badge-accent {
  background: var(--color-accent);
  color: var(--color-text-invert);
}

/* --- 구분선 ---------------------------------------------------------- */
.divider {
  height: var(--border-w);
  background: var(--color-border);
  border: none;
}

.divider-accent {
  height: var(--border-w-thick);
  width: 96px;
  background: var(--color-accent);
}

/* --- 라벨 붙은 값 (KPI) ---------------------------------------------- */
.stat {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.stat-value {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  color: var(--color-accent);
}

.stat-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  letter-spacing: var(--ls-wide);
}

/* --- 데이터 계열 색 (1~6 순서대로 사용) ------------------------------ */
.d1 { --c: var(--color-data-1); }
.d2 { --c: var(--color-data-2); }
.d3 { --c: var(--color-data-3); }
.d4 { --c: var(--color-data-4); }
.d5 { --c: var(--color-data-5); }
.d6 { --c: var(--color-data-6); }

.fill-data   { background: var(--c, var(--color-data-1)); }
.text-data   { color: var(--c, var(--color-data-1)); }
.border-data { border-color: var(--c, var(--color-data-1)); }

/* --- 정렬 유틸 ------------------------------------------------------- */
.items-center   { align-items: center; }
.items-start    { align-items: flex-start; }
.justify-center { justify-content: center; }
.justify-between{ justify-content: space-between; }
.grow           { flex: 1; }
/* ===== 베리에이션 토큰 (.v4 / .v5 / .v6) ===== */
/* ==========================================================================
   03_DARK_MODE — 어두운 바탕 + 저채도 표면 계층 + 소수의 고채도 발광 컬러
   기획: 00_GUIDES/PLANS/03_DARK_MODE.md

   V4~V6은 V1~V3(시안 · 앰버 · 바이올렛)과 색 계열과 화면 분할이 모두 다르다.
     V4 Midnight Emerald — 에메랄드 그린 / 좌 레일 + 우 스테이지 (수직 분할)
     V5 Rose Wine        — 와인 로즈 / 사선 분할 + 가로 KPI 스트립
     V6 Graphite Cobalt  — 뉴트럴 블랙 + 코발트 / 에디터 창(윈도우) 프레임
   ========================================================================== */

/* 공통: 다크에서 순백 텍스트는 눈부심을 만든다. 각 베리에이션이 한 단계 낮춘 값을 쓴다. */
.v4, .v5, .v6 {
  --color-bg-inverse: var(--color-bg);
  --color-text-on-inverse: var(--color-text);
}

/* --- V4 Midnight Emerald — 녹색 글로우, 좌 레일 / 우 스테이지 -------- */
.v4 {
  --color-bg: #07130f;
  --color-surface: #0e211a;
  --color-surface-alt: #16342a;
  --color-text: #dcefe6;            /* 순백 아님 */
  --color-text-muted: #8fb3a4;
  --color-text-invert: #07130f;
  --color-accent: #3ee0a1;
  --color-accent-sub: #1f9d71;
  --color-border: #1f4034;

  --v-glow: rgba(62, 224, 161, 0.20);        /* 라디얼 글로우 중심 */
  --v-glow-edge: rgba(62, 224, 161, 0);      /* 글로우 외곽(투명) */
  --v-glow-line: rgba(62, 224, 161, 0.50);   /* 포인트 선·카드 글로우 */

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --card-border-w: 1px;
  --shadow-sm: none;
  --shadow-md: none;
}

/* --- V5 Rose Wine — 와인 로즈, 사선 분할, 직각에 가까운 모서리 ------- */
.v5 {
  --color-bg: #170a10;
  --color-surface: #241119;
  --color-surface-alt: #381b28;
  --color-text: #f5e1e6;
  --color-text-muted: #bf98a5;
  --color-text-invert: #170a10;
  --color-accent: #ff6b8b;
  --color-accent-sub: #c2385a;
  --color-border: #44212f;

  --v-glow: rgba(255, 107, 139, 0.18);
  --v-glow-edge: rgba(255, 107, 139, 0);
  --v-glow-line: rgba(255, 107, 139, 0.45);
  --v-ring: rgba(255, 107, 139, 0.30);       /* 장식 링 선 */

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --card-border-w: 1px;
  --shadow-sm: none;
  --shadow-md: none;
}

/* --- V6 Graphite Cobalt — 뉴트럴 블랙, 에디터 창 프레임 -------------- */
.v6 {
  --color-bg: #0a0b0e;
  --color-surface: #14161b;
  --color-surface-alt: #1e222a;
  --color-text: #e4e7ee;
  --color-text-muted: #98a0b2;
  --color-text-invert: #0a0b0e;
  --color-accent: #5a9cff;
  --color-accent-sub: #2f6fd6;
  --color-border: #2a2f3b;

  --v-glow: rgba(90, 156, 255, 0.14);
  --v-glow-edge: rgba(90, 156, 255, 0);
  --v-glow-line: rgba(90, 156, 255, 0.40);
  --v-row-key: rgba(90, 156, 255, 0.12);     /* 강조 행 틴트 */

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --card-border-w: 1px;
  --shadow-sm: none;
  --shadow-md: none;
}
  </style>
  <style>
    .page-inner { gap: var(--sp-6); }

    /* 헤더: 좌 제목 / 우 기간 탭. 표지의 사선을 짧은 로즈 막대 하나로 승계한다. */
    .page-head { display: flex; align-items: center; gap: var(--sp-4); }
    .head-mark { width: 8px; height: 56px; background: var(--color-accent); flex: none; }
    .head-title { flex: 1; }
    .tabs { display: flex; gap: var(--sp-2); }
    .tab {
      padding: var(--sp-2) var(--sp-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
    }
    .tab.is-on { background: var(--color-surface-alt); border-color: var(--color-surface-alt); color: var(--color-text); }

    /* KPI 스트립: 한 장의 표면을 4칸으로 나눈다. 숫자는 강조색 없이 본문색. */
    .kpi-strip {
      display: flex;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
    }
    .kpi { flex: 1; display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-4) var(--sp-5); }
    .kpi + .kpi { border-left: 1px solid var(--color-border); }
    .kpi-label { font-size: var(--fs-caption); letter-spacing: var(--ls-wide); color: var(--color-text-muted); }
    .kpi-value { font-size: var(--fs-h2); font-weight: var(--fw-semibold); line-height: var(--lh-heading); }

    .body-row { display: flex; gap: var(--grid-gutter); flex: 1; }

    .rank { flex: 2; display: flex; flex-direction: column; gap: var(--sp-3); }
    .rank-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); }
    .rank-list { display: flex; flex-direction: column; justify-content: space-between; flex: 1; padding: var(--sp-3) 0 var(--sp-2); }
    .rank-row { display: flex; align-items: center; gap: var(--sp-4); }
    .rank-name { width: 240px; flex: none; font-size: var(--fs-body-m); color: var(--color-text-muted); }
    .rank-track { flex: 1; height: 32px; border-radius: var(--radius-sm); background: var(--color-surface); }
    .rank-fill { height: 32px; border-radius: var(--radius-sm); background: var(--color-surface-alt); }
    .rank-val { width: 96px; flex: none; text-align: right; font-size: var(--fs-body-m); color: var(--color-text-muted); }
    .rank-row.is-key .rank-name { color: var(--color-text); font-weight: var(--fw-semibold); }
    .rank-row.is-key .rank-fill { background: var(--color-accent); }
    .rank-row.is-key .rank-val { color: var(--color-accent); font-weight: var(--fw-bold); }

    /* 우측 콜아웃: 좌측 8px 로즈 띠가 이 카드를 강조한다 */
    .callout {
      flex: 1;
      display: flex;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .callout-bar { width: 8px; background: var(--color-accent); flex: none; }
    .callout-body { flex: 1; display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-5); }
    .callout-label { font-size: var(--fs-caption); letter-spacing: var(--ls-wide); color: var(--color-accent); }
    .callout-text { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-heading); }
    .callout-sub { font-size: var(--fs-body-m); color: var(--color-text-muted); }
    .callout-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      padding-top: var(--sp-4);
      border-top: 1px solid var(--color-border);
    }
    .action { display: flex; gap: var(--sp-3); font-size: var(--fs-body-m); }
    .action-no { color: var(--color-accent); width: 32px; flex: none; }
  </style>
</head>

            <div class="rank-row is-key"><p class="rank-name">가격 부담</p><div class="rank-track"><div class="rank-fill" style="width: 100%"></div></div><p class="rank-val t-nums">34%</p></div>
            <div class="rank-row"><p class="rank-name">콘텐츠 부족</p><div class="rank-track"><div class="rank-fill" style="width: 71%"></div></div><p class="rank-val t-nums">24%</p></div>
