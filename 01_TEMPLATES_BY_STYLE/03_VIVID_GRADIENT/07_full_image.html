<!-- @card 전면 이미지 | 배경 이미지 + 오버레이 텍스트 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전면 이미지</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    /* 이 테마는 기본 배경이 이미 짙은 남색이라 반전이 필요 없다 */
    .slide { background: var(--color-bg); }

    /* 이미지 자리 표시용 추상 배경 — 실제 사용 시 <img>로 교체 */
    .bg-abstract { position: absolute; left: 0; top: 0; }

    .overlay-inner { justify-content: flex-end; gap: var(--sp-4); }
    .overlay-kicker-row { display: flex; align-items: center; gap: var(--sp-3); }
    .kicker-dot {
      width: 12px;
      height: 12px;
      border-radius: var(--radius-full);
      background: var(--gradient-accent);   /* 슬라이드당 1곳 규칙 — 여기 한 곳에만 사용 */
    }
    .overlay-kicker {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      color: var(--color-accent-sub);
      letter-spacing: var(--ls-wide);
    }
    .overlay-title {
      color: var(--color-text);
      max-width: 1300px;
    }
    .overlay-sub {
      font-size: var(--fs-h3);
      font-weight: var(--fw-regular);
      color: var(--color-text-muted);
      line-height: 1.5;
      max-width: 1100px;
    }
    .overlay-caption {
      margin-top: var(--sp-5);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <div class="slide">

    <svg class="bg-abstract" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
      <circle cx="1560" cy="180" r="420" fill="var(--color-accent)" fill-opacity="0.16"/>
      <circle cx="1780" cy="640" r="280" fill="var(--color-accent-sub)" fill-opacity="0.14"/>
      <circle cx="240" cy="920" r="360" fill="var(--color-accent)" fill-opacity="0.10"/>
      <path d="M0 760 L1920 320" stroke="var(--color-accent-sub)" stroke-opacity="0.20" stroke-width="2"/>
      <path d="M0 860 L1920 420" stroke="var(--color-accent-sub)" stroke-opacity="0.12" stroke-width="2"/>
    </svg>

    <div class="slide-inner overlay-inner">
      <div class="overlay-kicker-row">
        <div class="kicker-dot"></div>
        <p class="overlay-kicker">VISION 2027</p>
      </div>
      <h1 class="t-display overlay-title">고객의 첫 2주를<br>바꾸는 회사</h1>
      <p class="overlay-sub">제품이 아니라 고객의 성공 경험을 판다. 온보딩에서 승부가 갈린다.</p>
      <p class="t-caption overlay-caption">이미지 영역 — 실제 사용 시 배경 SVG를 &lt;img&gt; 사진으로 교체</p>
    </div>

  </div>
</body>
</html>
