<!-- @card 전면 이미지 | 배경 이미지 + 오버레이 텍스트 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전면 이미지</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    /* 반전 슬라이드 — 테마별 반전색 토큰 사용. 프레젠테이션당 1장만 */
    .slide { background: var(--color-bg-inverse); }

    /* 이미지 자리 표시용 추상 배경 — 실제 사용 시 <img>로 교체 */
    .bg-abstract { position: absolute; left: 0; top: 0; }

    .overlay-inner { justify-content: flex-end; gap: var(--sp-4); }
    .overlay-kicker {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
      color: var(--color-text-on-inverse-muted);
      letter-spacing: var(--ls-wide);
    }
    .overlay-rule {
      width: 96px;
      height: 8px;
      background: var(--gradient-accent, var(--color-accent));
      margin-bottom: var(--sp-2);
    }
    .overlay-title {
      color: var(--color-text-on-inverse);
      max-width: 1300px;
    }
    .overlay-sub {
      font-size: var(--fs-h3);
      font-weight: var(--fw-regular);
      color: var(--color-text-on-inverse-muted);
      line-height: 1.5;
      max-width: 1100px;
    }
    .overlay-caption {
      margin-top: var(--sp-5);
      color: var(--color-text-on-inverse-muted);
    }
  </style>
</head>
<body>
  <div class="slide">

    <svg class="bg-abstract" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
      <circle cx="1520" cy="240" r="440" stroke="var(--color-text-on-inverse)" stroke-opacity="0.10" stroke-width="2"/>
      <circle cx="1520" cy="240" r="300" stroke="var(--color-text-on-inverse)" stroke-opacity="0.07" stroke-width="2"/>
      <circle cx="1520" cy="240" r="160" fill="var(--color-accent)" fill-opacity="0.16"/>
      <circle cx="280" cy="960" r="320" fill="var(--color-accent)" fill-opacity="0.08"/>
      <path d="M0 720 L1920 300" stroke="var(--color-text-on-inverse)" stroke-opacity="0.10" stroke-width="2"/>
      <path d="M0 820 L1920 400" stroke="var(--color-text-on-inverse)" stroke-opacity="0.05" stroke-width="2"/>
    </svg>

    <div class="slide-inner overlay-inner">
      <div class="overlay-rule"></div>
      <p class="overlay-kicker">VISION 2027</p>
      <h1 class="t-display overlay-title">고객의 첫 2주를<br>바꾸는 회사</h1>
      <p class="overlay-sub">제품이 아니라 고객의 성공 경험을 판다. 온보딩에서 승부가 갈린다.</p>
      <p class="t-caption overlay-caption">이미지 영역 — 실제 사용 시 배경 SVG를 &lt;img&gt; 사진으로 교체</p>
    </div>

  </div>
</body>
</html>
