<!-- @card 목차 | 섹션 목록 + 번호 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>목차</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    /* 좌측 4컬럼 제목 블록 + 우측 8컬럼 목록의 비대칭 구성 */
    .agenda-row { flex: 1; align-items: stretch; gap: var(--sp-8); }

    .agenda-intro {
      width: 480px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }
    .agenda-kicker {
      font-size: var(--fs-caption);
      font-weight: var(--fw-semibold);
      color: var(--color-accent);
      letter-spacing: var(--ls-wide);
    }
    .agenda-intro-desc {
      font-size: var(--fs-body-m);
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    .agenda-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .agenda-item {
      display: flex;
      align-items: center;
      gap: var(--sp-6);
      padding: var(--sp-5) 0;
      border-bottom: var(--border-w) solid var(--color-border);
    }
    .agenda-item:first-child { border-top: var(--border-w) solid var(--color-border); }
    .agenda-num {
      font-size: var(--fs-h1);
      font-weight: var(--fw-bold);
      line-height: 1;
      color: var(--color-text);
      opacity: 0.16;                 /* 고스트 번호 — 크지만 뒤로 물러나게 */
      width: 112px;
      flex-shrink: 0;
    }
    .agenda-body { display: flex; flex-direction: column; gap: var(--sp-1); flex: 1; }
    .agenda-name {
      font-size: var(--fs-h3);
      font-weight: var(--fw-semibold);
    }
    .agenda-desc {
      font-size: var(--fs-body-m);
      color: var(--color-text-muted);
    }
    .agenda-time {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      letter-spacing: var(--ls-wide);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-inner">

      <div class="row agenda-row">

        <div class="agenda-intro">
          <p class="agenda-kicker">AGENDA</p>
          <h1 class="t-h1">오늘 다룰<br>네 가지</h1>
          <div class="divider-accent"></div>
          <p class="agenda-intro-desc">진단에서 실행까지, 앞 순서의 결론이 다음 순서의 전제가 되도록 구성했습니다.</p>
        </div>

        <div class="agenda-list">
          <div class="agenda-item">
            <p class="agenda-num">01</p>
            <div class="agenda-body">
              <p class="agenda-name">시장 환경 진단</p>
              <p class="agenda-desc">산업 동향과 경쟁 구도, 자사 포지션 분석</p>
            </div>
            <p class="agenda-time">10 MIN</p>
          </div>
          <div class="agenda-item">
            <p class="agenda-num">02</p>
            <div class="agenda-body">
              <p class="agenda-name">전략 방향</p>
              <p class="agenda-desc">3대 전략 축과 목표 지표 정의</p>
            </div>
            <p class="agenda-time">15 MIN</p>
          </div>
          <div class="agenda-item">
            <p class="agenda-num">03</p>
            <div class="agenda-body">
              <p class="agenda-name">실행 로드맵</p>
              <p class="agenda-desc">분기별 핵심 과제와 담당 조직, 마일스톤</p>
            </div>
            <p class="agenda-time">15 MIN</p>
          </div>
          <div class="agenda-item">
            <p class="agenda-num">04</p>
            <div class="agenda-body">
              <p class="agenda-name">투자 계획 · Q&amp;A</p>
              <p class="agenda-desc">예산 배분안과 기대 효과, 질의응답</p>
            </div>
            <p class="agenda-time">10 MIN</p>
          </div>
        </div>

      </div>

    </div>
  </div>
</body>
</html>
