<!-- @card 표지 · 간지 템플릿 | 제목 · 부제 · 발표자 · 날짜 · 다색 장식 | 1920x1080 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>표지</title>
  <link rel="stylesheet" href="../../03_ASSETS/css/00_reset.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/01_variables.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/02_slide_base.css">
  <link rel="stylesheet" href="../../03_ASSETS/css/03_components.css">
  <link rel="stylesheet" href="_style.css">
  <style>
    /* 배경 장식: 다색 조각 — 우측 절반에만. 텍스트 영역(좌측)을 침범하지 않는다.
       색은 data-1부터 순서대로. 면적 합계 35% 이하, 한 조각 15% 이하. */
    .cover-decor {
      position: absolute;
      right: 0;
      top: 160px;                  /* 헤더 라벨(상단)과 푸터 메타(하단)를 피한 중간 밴드 */
    }

    .cover-inner { justify-content: space-between; }

    .cover-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cover-brand { display: flex; align-items: center; gap: var(--sp-3); }
    .cover-org {
      font-size: var(--fs-caption);
      font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-wide);
      color: var(--color-text-muted);
    }

    .cover-main {
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
    }
    /* 규칙선: 다색 3분할 — 이 스타일 패밀리의 시그니처 */
    .cover-title { max-width: 1200px; }
    .cover-sub {
      font-size: var(--fs-h3);
      font-weight: var(--fw-regular);
      color: var(--color-text-muted);
      line-height: 1.5;
      max-width: 1000px;
    }

    .cover-foot {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-top: var(--border-w) solid var(--color-border);
      padding-top: var(--sp-5);
    }
    .cover-meta { display: flex; gap: var(--sp-8); }
    .cover-meta-item { display: flex; flex-direction: column; gap: var(--sp-2); }
    .cover-meta-label {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      letter-spacing: var(--ls-wide);
    }
    .cover-meta-value {
      font-size: var(--fs-body-m);
      font-weight: var(--fw-semibold);
    }
  </style>
</head>
<body>
  <div class="slide">

    <!-- 다색 장식 조각 6개 — data-1~6 순서. 우측 상단 사분면에만 배치 -->
    <svg class="cover-decor" width="880" height="620" viewBox="0 0 880 620" fill="none">
      <circle cx="700" cy="150" r="130" fill="var(--color-data-1)"/>
      <rect x="430" y="240" width="200" height="200" rx="24"
            fill="var(--color-data-2)"/>
      <path d="M700 320 L830 520 L570 520 Z" fill="var(--color-data-3)"/>
      <rect x="300" y="80" width="110" height="110" rx="12"
            fill="var(--color-data-4)"/>
      <circle cx="380" cy="500" r="70" fill="var(--color-data-5)"/>
      <rect x="660" y="540" width="120" height="48" rx="24"
            fill="var(--color-data-6)"/>
    </svg>

    <div class="slide-inner cover-inner">

      <div class="cover-head">
        <div class="cover-brand">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <circle cx="12" cy="12" r="10" fill="var(--color-data-1)"/>
            <rect x="16" y="16" width="18" height="18" rx="4" fill="var(--color-data-4)"/>
          </svg>
          <p class="cover-org">스튜디오 온빛</p>
        </div>
        <p class="cover-org">BRAND CAMPAIGN · 2026</p>
      </div>

      <div class="cover-main">
        <!-- 다색 규칙선: 3색 분할 바 -->
        <svg width="144" height="8" viewBox="0 0 144 8">
          <rect x="0"  y="0" width="48" height="8" fill="var(--color-data-1)"/>
          <rect x="48" y="0" width="48" height="8" fill="var(--color-data-2)"/>
          <rect x="96" y="0" width="48" height="8" fill="var(--color-data-3)"/>
        </svg>
        <p class="cover-org">2026 브랜드 캠페인 킥오프</p>
        <h1 class="t-display cover-title">우리가 만드는<br>다음 이야기</h1>
        <p class="cover-sub">브랜드 방향 · 캠페인 구조 · 채널별 실행 계획</p>
      </div>

      <div class="cover-foot">
        <div class="cover-meta">
          <div class="cover-meta-item">
            <p class="cover-meta-label">PRESENTER</p>
            <p class="cover-meta-value">이서준 · 브랜드팀</p>
          </div>
          <div class="cover-meta-item">
            <p class="cover-meta-label">DATE</p>
            <p class="cover-meta-value">2026. 09. 03</p>
          </div>
          <div class="cover-meta-item">
            <p class="cover-meta-label">AUDIENCE</p>
            <p class="cover-meta-value">전사 공개</p>
          </div>
        </div>
        <p class="cover-org">ver 1.0</p>
      </div>

    </div>
  </div>
</body>
</html>
